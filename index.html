 "Dermatomyositis (DM)", "aka": "Adult and juvenile dermatomyositis; amyopathic DM", "ov": "An autoimmune disease of skin and muscle. Antibodies predict its course: anti-TIF1-γ and anti-NXP2 carry cancer risk in adults, anti-MDA5 causes rapidly progressive lung disease, and anti-Mi-2 classic skin-and-muscle disease. Juvenile DM is the most common childhood myositis and often causes calcinosis.", "sx": ["Proximal weakness: trouble rising from a chair, climbing stairs, lifting arms", "Heliotrope rash (violet eyelids) and Gottron papules over the knuckles", "V-neck and shawl rashes after sun exposure; itchy scalp", "Mechanic's hands, nailfold changes, calcium deposits under the skin", "Swallowing difficulty, breathlessness from ILD"], "early": ["Itchy, sun-sensitive rash on the eyelids, knuckles, or upper chest, with or without weakness", "New weakness in the hips and shoulders over weeks"], "red": ["Rapidly worsening breathlessness, especially with anti-MDA5 — emergency", "Choking or aspiration from weak swallowing muscles", "Weight loss or other cancer symptoms (adult DM)"], "dx": ["CK and aldolase (can be normal in amyopathic DM); myositis-specific antibody panel", "EMG, muscle MRI (edema), skin or muscle biopsy", "HRCT and PFTs for ILD", "Age-appropriate cancer screening, often repeated for 3 years, especially with anti-TIF1-γ or anti-NXP2"], "ddx": [["Systemic lupus", "Photosensitive rash, fatigue", "Malar rash spares nasolabial folds; knuckle rash between joints; lupus antibodies"], ["Statin or drug-induced myopathy", "Weakness with high CK", "Drug timing; no skin findings"], ["Hypothyroid myopathy", "Proximal weakness, raised CK", "Raised TSH; improves with thyroid replacement"], ["Psoriasis or eczema", "Scaly rash", "Lacks Gottron papules and weakness"]], "tx": [["Muscle and systemic disease", ["High-dose glucocorticoids plus a steroid-sparing agent (methotrexate, azathioprine, mycophenolate)", "IVIG (Octagam 10% FDA-approved for adult DM)", "Rituximab, tacrolimus, or JAK inhibitors for refractory disease", "Brepocitinib (Lisraya), an oral TYK2/JAK1 inhibitor, approved for adult DM in Aug 2026 (VALOR trial)"]], ["Skin", ["Strict sun protection; topical steroids or calcineurin inhibitors; hydroxychloroquine (watch for rash flares)"]], ["Anti-MDA5 rapidly progressive ILD", ["Early combination therapy (steroids, calcineurin inhibitor, cyclophosphamide or JAK inhibitor) in a specialist center"]], ["Rehabilitation", ["Supervised exercise is safe and helpful; swallow therapy"]]], "upd": ["Aug 2026: FDA approved brepocitinib (Lisraya), the first oral drug for adult dermatomyositis."], "tags": ["muscle weakness", "rash", "photosensitivity", "swallowing difficulty", "shortness of breath"], "refs": [["Healio: FDA approves Lisraya as first oral drug for dermatomyositis (2026)", "https://www.healio.com/news/rheumatology/20261013/fda-approves-lisraya-as-first-oral-drug-for-dermatomyositis"], ["Aggarwal R, et al. Trial of Intravenous Immune Globulin in Dermatomyositis (ProDERM). N Engl J Med. 2022", "https://pubmed.ncbi.nlm.nih.gov/?term=Trial%20of%20Intravenous%20Immune%20Globulin%20in%20Dermatomyositis"], ["Lundberg IE, et al. 2017 EULAR/ACR classification criteria for adult and juvenile idiopathic inflammatory myopathies. Ann Rheum Dis. 2017", "https://pubmed.ncbi.nlm.nih.gov/?term=2017%20European%20League%20Against%20Rheumatism%2FAmerican%20College%20of%20Rheumatology%20classification%20criteria%20for%20adult%20and%20juvenile%20idiopathic%20inflammatory%20myopathies"], ["NIAMS: Myositis", "https://www.niams.nih.gov/health-topics/myositis"]], "alt": [{"c": "Exercise", "t": "Supervised strength and endurance training", "e": "some", "n": "Multiple trials show exercise is safe in active and chronic myositis and improves strength and function; start with low-load resistance work under a therapist."}, {"c": "Supplements & vitamins", "t": "Creatine monohydrate with exercise", "e": "some", "n": "A randomized trial in polymyositis and dermatomyositis showed better functional performance with creatine plus home exercise; check kidney function first."}, {"c": "Lifestyle", "t": "Strict sun protection", "e": "standard", "n": "UV light worsens the rash; broad-spectrum sunscreen and clothing."}, {"c": "Supplements & vitamins", "t": "Calcium and vitamin D while taking glucocorticoids", "e": "standard", "n": "Recommended for adults on long-term steroids to protect bone, together with fracture-risk assessment (2022 ACR)."}], "altRefs": [["Chung YL, et al. Creatine supplements in patients with idiopathic inflammatory myopathies who are clinically weak after conventional pharmacologic treatment. Arthritis Rheum. 2007", "https://pubmed.ncbi.nlm.nih.gov/?term=Creatine%20supplements%20in%20patients%20with%20idiopathic%20inflammatory%20myopathies%20who%20are%20clinically%20weak%20after%20conventional%20pharmacologic%20treatment"], ["Alexanderson H. Exercise in myositis. Curr Treatm Opt Rheumatol. 2018", "https://pubmed.ncbi.nlm.nih.gov/?term=Alexanderson%20Exercise%20in%20Myositis%20Current%20Treatment%20Options%20in%20Rheumatology"], ["Humphrey MB, et al. 2022 ACR Guideline for the Prevention and Treatment of Glucocorticoid-Induced Osteoporosis. Arthritis Rheumatol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%20Guideline%20for%20the%20Prevention%20and%20Treatment%20of%20Glucocorticoid-Induced%20Osteoporosis"]]}, "antisynthetase": {"id": "antisynthetase", "name": "Antisynthetase Syndrome", "aka": "Anti-Jo-1 syndrome", "ov": "A myositis subtype defined by antibodies against aminoacyl-tRNA synthetases (Jo-1, PL-7, PL-12, EJ, OJ and others). Interstitial lung disease is the main threat and may appear without muscle disease, especially with non-Jo-1 antibodies.", "sx": ["Interstitial lung disease: dry cough, breathlessness", "Myositis (proximal weakness)", "Inflammatory arthritis", "Mechanic's hands (cracked, rough fingertips), Raynaud, fever"], "early": ["Unexplained ILD with arthritis or rough, cracked fingers"], "red": ["Rapidly worsening breathlessness or falling oxygen levels"], "dx": ["Myositis antibody panel (anti-synthetase antibodies; anti-Ro52 often co-exists)", "HRCT (NSIP or organizing pneumonia patterns), PFTs with DLCO", "CK, EMG, MRI, muscle biopsy as needed"], "ddx": [["Idiopathic pulmonary fibrosis", "Progressive ILD", "Older age, UIP pattern, no autoantibodies or extrapulmonary features"], ["Rheumatoid arthritis with ILD", "Arthritis plus ILD", "RF/anti-CCP, erosions; no synthetase antibodies"], ["Sarcoidosis", "Lung disease with arthritis", "Hilar nodes, granulomas on biopsy"]], "tx": [["Treatment", ["Glucocorticoids plus mycophenolate, azathioprine, or tacrolimus (2023 ACR/CHEST ILD guideline)", "Rituximab for refractory or severe ILD", "Nintedanib for progressive fibrosis; pulmonary rehabilitation; lung transplant evaluation in end-stage disease"]]], "tags": ["shortness of breath", "cough", "muscle weakness", "joint pain", "cracked fingers", "Raynaud"], "refs": [["Johnson SR, et al. 2023 ACR/CHEST Guideline for Treatment of ILD in Systemic Autoimmune Rheumatic Diseases. Arthritis Rheumatol. 2024", "https://pubmed.ncbi.nlm.nih.gov/38978310/"], ["Connors GR, et al. Interstitial lung disease associated with the idiopathic inflammatory myopathies. Chest. 2010", "https://pubmed.ncbi.nlm.nih.gov/?term=Interstitial%20lung%20disease%20associated%20with%20the%20idiopathic%20inflammatory%20myopathies%3A%20what%20progress%20has%20been%20made%20in%20the%20past%2035%20years"]], "alt": [{"c": "Exercise", "t": "Pulmonary rehabilitation and supervised exercise", "e": "some", "n": "Improves exercise tolerance in ILD and strength in myositis."}, {"c": "Supplements & vitamins", "t": "Calcium and vitamin D while taking glucocorticoids", "e": "standard", "n": "Recommended for adults on long-term steroids to protect bone, together with fracture-risk assessment (2022 ACR)."}, {"c": "Lifestyle", "t": "Stop smoking", "e": "standard", "n": "Protects the lungs."}], "altRefs": [["Humphrey MB, et al. 2022 ACR Guideline for the Prevention and Treatment of Glucocorticoid-Induced Osteoporosis. Arthritis Rheumatol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%20Guideline%20for%20the%20Prevention%20and%20Treatment%20of%20Glucocorticoid-Induced%20Osteoporosis"]]}, "imnm": {"id": "imnm", "name": "Immune-Mediated Necrotizing Myopathy (IMNM)", "aka": "Anti-HMGCR myopathy (statin-associated), anti-SRP myopathy", "ov": "An aggressive myositis with muscle-fiber necrosis and little inflammation on biopsy. Anti-HMGCR disease is often triggered by statins and keeps progressing after the statin is stopped. Anti-SRP disease is often severe. Seronegative IMNM has a higher cancer association.", "sx": ["Subacute, symmetric proximal weakness that can be severe", "Very high CK, often in the thousands", "Muscle pain, swallowing difficulty; few skin findings"], "early": ["Weakness and high CK that persist months after stopping a statin"], "red": ["Rapidly progressive weakness, breathing or swallowing problems"], "dx": ["CK, anti-HMGCR and anti-SRP antibodies", "MRI showing muscle edema; biopsy with necrotic fibers", "Cancer screening, particularly for seronegative and anti-HMGCR disease"], "ddx": [["Self-limited statin myalgia", "Muscle aches on a statin", "Resolves within weeks of stopping; CK normal or mildly raised"], ["Muscular dystrophy", "Proximal weakness with high CK", "Slow progression, family history, genetic testing"], ["Hypothyroidism", "Weakness and raised CK", "Abnormal thyroid tests"]], "tx": [["Treatment", ["Glucocorticoids with early IVIG; IVIG alone can work in anti-HMGCR disease", "Methotrexate, rituximab (especially anti-SRP), or other steroid-sparing agents", "Stop statins permanently in anti-HMGCR disease; use non-statin lipid therapy (e.g., PCSK9 inhibitors)"]]], "tags": ["muscle weakness", "muscle pain", "swallowing difficulty"], "refs": [["Allenbach Y, et al. 224th ENMC International Workshop: Clinico-sero-pathological classification of immune-mediated necrotizing myopathies. Neuromuscul Disord. 2018", "https://pubmed.ncbi.nlm.nih.gov/?term=224th%20ENMC%20International%20Workshop%20immune-mediated%20necrotizing%20myopathies"]], "alt": [{"c": "Exercise", "t": "Supervised exercise once CK is controlled", "e": "some", "n": "Gradual resistance training improves strength."}, {"c": "Supplements & vitamins", "t": "Coenzyme Q10", "e": "limited", "n": "Mixed trial results for ordinary statin muscle aches; it does not treat immune-mediated myopathy."}, {"c": "Supplements & vitamins", "t": "Calcium and vitamin D while taking glucocorticoids", "e": "standard", "n": "Recommended for adults on long-term steroids to protect bone, together with fracture-risk assessment (2022 ACR)."}], "altRefs": [["Humphrey MB, et al. 2022 ACR Guideline for the Prevention and Treatment of Glucocorticoid-Induced Osteoporosis. Arthritis Rheumatol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%20Guideline%20for%20the%20Prevention%20and%20Treatment%20of%20Glucocorticoid-Induced%20Osteoporosis"]]}, "gca": {"id": "gca", "name": "Giant Cell Arteritis (GCA)", "aka": "Temporal arteritis", "ov": "Inflammation of medium and large arteries, especially the temporal arteries, in people over 50. The main emergency is sudden, permanent vision loss from ischemic optic neuropathy. Treat promptly while confirming the diagnosis.", "sx": ["New, persistent headache, often temporal", "Scalp tenderness, pain when chewing (jaw claudication)", "Visual disturbances: blurring, double vision, or sudden loss of vision", "Fever, fatigue, weight loss, shoulder and hip pain (overlapping polymyalgia rheumatica)"], "early": ["New headache or scalp tenderness in a person over 50", "Pain when chewing or talking", "Shoulder and hip stiffness with raised inflammation markers"], "red": ["Any sudden vision change — same-day emergency assessment; high-dose IV steroids may be given before biopsy", "Stroke-like symptoms or limb ischemia (large-vessel involvement)"], "dx": ["ESR and CRP (usually high)", "Temporal artery ultrasound (halo sign) or biopsy; PET-CT or MR angiography for large-vessel involvement", "Classification with the 2022 ACR/EULAR criteria"], "tx": [["Initial treatment", ["High-dose prednisone (about 40–60 mg/day) started promptly, before confirmatory biopsy if the diagnosis is strongly suspected", "Low-dose aspirin for ischemic prevention, with PPI protection if needed"]], ["Steroid-sparing and maintenance", ["Tocilizumab (IL-6 blocker, FDA-approved for GCA) allows faster taper and fewer relapses", "Upadacitinib (JAK inhibitor) was FDA-approved for GCA in April 2025", "Slow glucocorticoid taper over 6–12+ months; bone protection and infection prophylaxis"]]], "upd": ["Apr 2025: FDA approved upadacitinib (Rinvoq) for giant cell arteritis."], "tags": ["headache", "scalp tenderness", "jaw pain", "vision loss", "shoulder pain", "emergency"], "refs": [["2022 ACR/EULAR classification criteria for giant cell arteritis", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%2FEuropean%20Alliance%20of%20Associations%20for%20Rheumatology%20classification%20criteria%20for%20giant%20cell%20arteritis"], ["The Rheumatologist: FDA approval of upadacitinib for GCA", "https://www.the-rheumatologist.org/tag/fda-approval"], ["Maz M, et al. 2021 ACR guideline for the treatment of polymyalgia rheumatica and giant cell arteritis. Arthritis Care Res. 2021", "https://pubmed.ncbi.nlm.nih.gov/?term=2021%20American%20College%20of%20Rheumatology%20Guideline%20for%20the%20Treatment%20of%20Polymyalgia%20Rheumatica%20and%20Giant%20Cell%20Arteritis"]], "alt": [{"c": "Supplements & vitamins", "t": "Calcium and vitamin D while taking glucocorticoids", "e": "standard", "n": "Recommended for adults on long-term steroids to protect bone, together with fracture-risk assessment (2022 ACR)."}, {"c": "Exercise", "t": "Weight-bearing, resistance and balance exercise", "e": "some", "n": "Helps preserve bone and muscle and lowers fall risk during steroid treatment."}, {"c": "Diet", "t": "Lower-salt, lower-sugar diet during high-dose steroids", "e": "some", "n": "Limits steroid-related blood pressure, fluid, and glucose rises."}], "altRefs": [["Humphrey MB, et al. 2022 ACR Guideline for the Prevention and Treatment of Glucocorticoid-Induced Osteoporosis. Arthritis Rheumatol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%20Guideline%20for%20the%20Prevention%20and%20Treatment%20of%20Glucocorticoid-Induced%20Osteoporosis"]], "ddx": [["Polymyalgia rheumatica", "Shoulder and hip pain and stiffness", "No headache or visual symptoms; GCA must be excluded"], ["Migraine or cluster headache", "Headache", "Gradual onset after age 50, scalp tenderness, jaw claudication, raised ESR or CRP"], ["Non-arteritic optic neuropathy (NAION)", "Sudden vision loss", "No systemic symptoms and normal ESR or CRP; still an urgent eye review"], ["Herpes zoster ophthalmicus", "Headache and eye symptoms", "Vesicular rash in one dermatome; no raised inflammation markers"]]}, "anca": {"id": "anca", "name": "GPA & MPA (ANCA-Associated Vasculitis)", "aka": "Granulomatosis with polyangiitis (formerly Wegener's), microscopic polyangiitis; see EGPA for the eosinophilic form", "ov": "Small-vessel vasculitis with antibodies to neutrophil cytoplasmic antigens (PR3 or MPO). Kidneys and lungs are most often involved. Early treatment prevents irreversible kidney failure, and rituximab-based maintenance reduces relapse.", "sx": ["Granulomatosis with polyangiitis: sinus pain, nasal crusting, ear infections, hearing loss, lung nodules, blood in sputum", "Microscopic polyangiitis: rapidly progressive kidney failure, lung hemorrhage", "EGPA: asthma, sinus disease, eosinophilia, and nerve or heart involvement", "Fever, weight loss, rash, and nerve symptoms (mononeuritis multiplex)"], "early": ["Persistent sinus infections, nasal ulcers, or blood-tinged discharge that do not respond to antibiotics", "New asthma in adulthood with rising eosinophils", "Unexplained blood or protein in urine with declining kidney function"], "red": ["Coughing blood or breathlessness (alveolar hemorrhage) — emergency", "Rapidly worsening kidney function, dark urine, or red blood cell casts (urgent nephrology review)", "Sudden nerve weakness or numbness in several limbs"], "dx": ["ANCA testing (PR3 and MPO) with follow-up ELISA; complete blood count, kidney function, urinalysis", "Imaging: chest CT, sinus CT; biopsy of kidney or affected tissue", "Classification with the 2022 ACR/EULAR vasculitis classification criteria"], "tx": [["Induction", ["High-dose glucocorticoids with rituximab or cyclophosphamide", "Avacopan (C5a receptor antagonist) can reduce high-dose steroid exposure as an add-on", "Plasma exchange for severe kidney disease or alveolar hemorrhage with dialysis-dependent kidney failure"]], ["Maintenance", ["Rituximab (preferred) or azathioprine or mycophenolate for 2 years or more", "Monitor for relapse with ANCA levels and clinical review; PJP prophylaxis during high-dose therapy"]]], "tags": ["sinus infection", "nasal ulcers", "cough blood", "kidney", "asthma", "nerve weakness"], "refs": [["2022 ACR/EULAR classification criteria for vasculitis", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%2FEuropean%20Alliance%20of%20Associations%20for%20Rheumatology%20classification%20criteria%20for%20vasculitis"], ["EULAR recommendations for the management of ANCA-associated vasculitis (2024)", "https://pubmed.ncbi.nlm.nih.gov/?term=EULAR%20recommendations%20for%20the%20management%20of%20ANCA-associated%20vasculitis"]], "alt": [{"c": "Supplements & vitamins", "t": "Calcium and vitamin D while taking glucocorticoids", "e": "standard", "n": "Recommended for adults on long-term steroids to protect bone, together with fracture-risk assessment (2022 ACR)."}, {"c": "Exercise", "t": "Weight-bearing, resistance and balance exercise", "e": "some", "n": "Helps preserve bone and muscle and lowers fall risk during steroid treatment."}, {"c": "Lifestyle", "t": "Stop smoking", "e": "standard", "n": "Protects lungs and kidneys."}], "altRefs": [["Humphrey MB, et al. 2022 ACR Guideline for the Prevention and Treatment of Glucocorticoid-Induced Osteoporosis. Arthritis Rheumatol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%20Guideline%20for%20the%20Prevention%20and%20Treatment%20of%20Glucocorticoid-Induced%20Osteoporosis"]], "ddx": [["Chronic sinusitis", "Sinus pain, nasal discharge", "Responds to antibiotics; no kidney or lung involvement; ANCA negative"], ["Anti-GBM disease (Goodpasture)", "Lung haemorrhage and kidney disease", "Anti-GBM antibodies; linear IgG deposits on kidney biopsy"], ["Sarcoidosis or lymphoma", "Lung nodules, nasal or skin lesions", "Biopsy shows granulomas or lymphoma; ANCA negative"], ["Lupus nephritis", "Kidney disease, rash", "ANA and anti-dsDNA positive; complement low; immune complex deposits"]]}, "igg4": {"id": "igg4", "name": "IgG4-Related Disease (IgG4-RD)", "aka": "Autoimmune pancreatitis type 1, Mikulicz disease, retroperitoneal fibrosis", "ov": "A fibro-inflammatory disease that forms tumor-like swelling in one or many organs, often mistaken for cancer. Common sites are the pancreas, bile ducts, salivary and tear glands, orbits, kidneys, retroperitoneum, and aorta. It responds to glucocorticoids but relapses often.", "sx": ["Painless swelling of salivary or tear glands", "Jaundice or weight loss (pancreas or bile ducts)", "Back or flank pain (retroperitoneal fibrosis)", "Bulging eyes, sinus disease, asthma or allergy history"], "early": ["Bilateral salivary or lacrimal gland swelling", "A pancreatic mass with diffuse enlargement in an older man"], "red": ["Obstructive jaundice or a kidney blocked by fibrosis", "Any mass — cancer and lymphoma must be excluded"], "dx": ["Serum IgG4 (raised in many but neither sensitive nor specific)", "Biopsy: dense IgG4+ plasma cells, storiform fibrosis, obliterative phlebitis", "CT/MRI/PET to map organ involvement", "2019 ACR/EULAR classification criteria"], "ddx": [["Pancreatic or biliary cancer", "Pancreatic mass, jaundice", "Biopsy and imaging features; IgG4 can be mildly raised in cancer"], ["Sjögren's disease", "Salivary swelling", "Anti-SSA/SSB, dryness predominant"], ["Lymphoma", "Gland enlargement, lymphadenopathy", "Clonal cells on biopsy"], ["ANCA vasculitis or sarcoidosis", "Orbital or sinus disease", "ANCA, granulomas"]], "tx": [["Treatment", ["Glucocorticoids for induction (rapid response)", "Inebilizumab (Uplizna, anti-CD19) — the first FDA-approved therapy (April 2025), which reduced flare risk in the MITIGATE trial", "Rituximab (off-label) or steroid-sparing agents for maintenance", "Stents for biliary or ureteral obstruction"]]], "upd": ["Apr 2025: FDA approved inebilizumab (Uplizna) as the first treatment for IgG4-related disease."], "tags": ["gland swelling", "jaundice", "back pain", "weight loss"], "refs": [["Amgen: Uplizna is now the first and only FDA-approved treatment for IgG4-RD (Apr 2025)", "https://www.amgen.com/newsroom/press-releases/2025/04/uplizna-inebilizumabcdon-is-now-the-first-and-only-fdaapproved-treatment-for-igg4related-disease"], ["Wallace ZS, et al. 2019 ACR/EULAR classification criteria for IgG4-related disease. Ann Rheum Dis. 2020", "https://pubmed.ncbi.nlm.nih.gov/?term=The%202019%20American%20College%20of%20Rheumatology%2FEuropean%20League%20Against%20Rheumatism%20classification%20criteria%20for%20IgG4-related%20disease"], ["Stone JH, et al. Inebilizumab for Treatment of IgG4-Related Disease (MITIGATE). N Engl J Med. 2025", "https://pubmed.ncbi.nlm.nih.gov/?term=Inebilizumab%20for%20Treatment%20of%20IgG4-Related%20Disease"]], "alt": [{"c": "Supplements & vitamins", "t": "Calcium and vitamin D while taking glucocorticoids", "e": "standard", "n": "Recommended for adults on long-term steroids to protect bone, together with fracture-risk assessment (2022 ACR)."}], "altRefs": [["Humphrey MB, et al. 2022 ACR Guideline for the Prevention and Treatment of Glucocorticoid-Induced Osteoporosis. Arthritis Rheumatol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=2022%20American%20College%20of%20Rheumatology%20Guideline%20for%20the%20Prevention%20and%20Treatment%20of%20Glucocorticoid-Induced%20Osteoporosis"]]}, "irae": {"id": "irae", "name": "Rheumatic Side Effects of Cancer Immunotherapy", "aka": "Immune checkpoint inhibitor immune-related adverse events (irAEs)", "ov": "Checkpoint inhibitors (anti-PD-1, anti-PD-L1, anti-CTLA-4) unleash the immune system against cancer but can cause inflammatory arthritis, polymyalgia-like illness, sicca, myositis, and vasculitis. Rheumatology and oncology plan treatment together so that cancer therapy can usually continue.", "sx": ["New inflammatory arthritis (small or large joints)", "Shoulder and hip girdle stiffness (PMR-like)", "Dry eyes and mouth", "Muscle weakness, drooping eyelids, double vision (myositis with or without myasthenia)"], "early": ["New joint pain or stiffness weeks to months after starting immunotherapy"], "red": ["Muscle weakness with chest pain, palpitations, breathlessness, or eyelid drooping — myositis-myocarditis-myasthenia overlap is life-threatening"], "dx": ["Clinical exam; CRP; RF and anti-CCP usually negative", "CK, troponin, and ECG if weakness appears", "Ultrasound for synovitis"], "ddx": [["Pre-existing autoimmune disease flare", "Joint inflammation on immunotherapy", "Known prior RA, PsA, or lupus"], ["Metastatic bone disease", "Bone or joint pain", "Imaging shows lesions"], ["Osteoarthritis", "Joint pain in older adults", "Mechanical pattern, no inflammation"]], "tx": [["Grade-based treatment", ["Mild: NSAIDs or intra-articular steroid; continue immunotherapy", "Moderate: low-to-moderate dose prednisone; hold immunotherapy if needed", "Steroid-refractory: methotrexate, hydroxychloroquine, IL-6 inhibitors, or TNF inhibitors, coordinated with oncology", "Myositis-myocarditis: high-dose steroids and urgent escalation (IVIG, plasma exchange, abatacept) in hospital"]]], "tags": ["joint pain", "shoulder pain", "dry mouth", "muscle weakness"], "refs": [["Kostine M, et al. EULAR points-to-consider for the diagnosis and management of rheumatic irAEs due to cancer immunotherapy. Ann Rheum Dis. 2021", "https://pubmed.ncbi.nlm.nih.gov/?term=EULAR%20points-to-consider%20for%20the%20diagnosis%20and%20management%20of%20rheumatic%20immune-related%20adverse%20events%20due%20to%20cancer%20immunotherapy%20with%20checkpoint%20inhibitors"]], "alt": [{"c": "Supplements & vitamins", "t": "Herbal products during cancer immunotherapy", "e": "against", "n": "Some herbs interact with cancer treatment or affect the liver; tell the oncology team about every supplement."}], "altRefs": [["NCCIH (NIH): Herbs at a Glance and safety information", "https://www.nccih.nih.gov/health/herbsataglance"]]}, "jia": {"id": "jia", "name": "Juvenile Idiopathic Arthritis (JIA)", "aka": "Oligoarticular, polyarticular, enthesitis-related, psoriatic JIA", "ov": "The most common chronic rheumatic disease of childhood: arthritis lasting at least 6 weeks with onset before age 16 and no other cause. Subtypes differ in joint pattern, antibody profile, and uveitis risk. Children with oligoarticular JIA and a positive ANA have the highest risk of silent uveitis.", "sx": ["Swollen joint(s), limping, especially in the morning", "Stiffness after rest; avoiding use of a limb", "Jaw (TMJ) involvement with chewing difficulty or jaw asymmetry", "Heel or back pain (enthesitis-related)"], "early": ["A toddler limping in the morning with a swollen knee and no injury", "Morning stiffness or reluctance to walk that improves through the day"], "red": ["Fever, night pain, weight loss, or abnormal blood counts — exclude infection and leukemia", "Red eye or vision change — but JIA uveitis is often painless, so routine eye screening is essential"], "dx": ["Clinical diagnosis after excluding infection, trauma, and malignancy", "ANA, RF, anti-CCP, HLA-B27 to classify subtype", "Ultrasound or MRI for joint and TMJ involvement", "Regular slit-lamp eye screening based on subtype, age, and ANA"], "ddx": [["Septic arthritis", "Swollen, painful joint in a child", "Fever, unable to bear weight, very high inflammation markers"], ["Leukemia", "Bone and joint pain", "Night pain, cytopenias, high LDH"], ["Reactive or post-viral arthritis", "Transient joint swelling", "Self-limited, follows infection"], ["Lyme arthritis", "Knee swelling", "Tick exposure, positive serology"]], "tx": [["2026 ACR guideline", ["Early DMARDs are favored over NSAIDs and systemic glucocorticoids", "Intra-articular triamcinolone hexacetonide for oligoarthritis", "Methotrexate (oral conditionally favored over subcutaneous)", "Biologics (TNF inhibitors, abatacept, tocilizumab) may start without first failing a conventional DMARD; JAK inhibitors are options", "Routine anti-drug antibody monitoring is not recommended"]], ["Uveitis", ["Topical steroids short term; methotrexate and adalimumab for chronic anterior uveitis"]], ["Supportive", ["Physical and occupational therapy, school support, growth and bone health monitoring"]]], "upd": ["May 2026: ACR released updated JIA treatment guidelines favoring early DMARDs and allowing biologics without prior csDMARD failure."], "tags": ["joint swelling", "limp", "morning stiffness", "red eye", "uveitis", "child"], "refs": [["ACR: Updated Guidelines for Treatment of Juvenile Idiopathic Arthritis (May 2026)", "https://rheumatology.org/press-releases/the-american-college-of-rheumatology-releases-updated-guidelines-for-treatment-of-juvenile-idiopathic-arthritis"], ["ACR: 2026 JIA Guideline Summary", "https://www.rheumatology.org/juvenile-idiopathic-arthritis-guideline"], ["NIAMS: Juvenile Arthritis", "https://www.niams.nih.gov/health-topics/juvenile-arthritis"]], "alt": [{"c": "Exercise", "t": "Physical and occupational therapy; regular play and sport", "e": "cond", "n": "Children with JIA should stay active; therapists tailor range-of-motion and strengthening exercises."}, {"c": "Diet", "t": "Balanced diet with enough calcium and vitamin D", "e": "some", "n": "Supports growth and bone health, especially with steroid use."}, {"c": "Supplements & vitamins", "t": "Unproven herbal or supplement regimens in children", "e": "against", "n": "Little safety data in children; interactions with methotrexate and biologics."}], "altRefs": [["ACR: 2026 JIA Guideline Summary (non-pharmacologic management)", "https://www.rheumatology.org/juvenile-idiopathic-arthritis-guideline"]]}}, "neuro": {"ms": {"id": "ms", "name": "Multiple Sclerosis (MS)", "aka": "MS, relapsing-remitting, progressive MS", "ov": "Chronic immune-mediated disease causing inflammation, demyelination and neurodegeneration in the brain, spinal cord and optic nerves. Typically starts age 20–40; about 3:1 female. Most begin relapsing-remitting; some progress (secondary or primary progressive).", "sx": ["Vision loss with eye pain (optic neuritis), double vision", "Numbness, tingling, band-like sensations; Lhermitte sign (electric shock down the spine on neck flexion)", "Weakness, spasticity, imbalance, gait difficulty", "Fatigue, bladder urgency, bowel and sexual dysfunction, cognitive and mood changes", "Heat sensitivity (Uhthoff phenomenon)"], "early": ["A first episode lasting >24 h (clinically isolated syndrome), such as optic neuritis or partial myelitis", "Unexplained transient numbness or visual blurring in a young adult", "Incidental MRI lesions typical of MS (radiologically isolated syndrome) may now meet criteria"], "dx": ["MRI brain and spine: lesions disseminated in space and time", "2024 McDonald criteria revision: adds optic nerve as a 5th location, central vein sign and paramagnetic rim lesions, and CSF kappa free light chains as alternatives to oligoclonal bands", "Exclude mimics: NMOSD (AQP4-IgG), MOGAD (MOG-IgG), B12 deficiency, vasculitis"], "tx": [["Disease-modifying therapy (start early)", ["High-efficacy: anti-CD20 antibodies (ocrelizumab IV or subcutaneous, ofatumumab, ublituximab), natalizumab, alemtuzumab, cladribine", "Moderate efficacy: S1P modulators (fingolimod, siponimod, ozanimod, ponesimod), fumarates (dimethyl, diroximel, monomethyl), teriflunomide", "Injectables: interferon-β, glatiramer acetate", "Primary progressive MS: ocrelizumab; active secondary progressive: siponimod, others", "Pregnancy planning and infection/vaccination screening guide drug choice"]], ["Relapses", ["High-dose methylprednisolone (IV or oral) for 3–5 days; plasma exchange for severe steroid-refractory attacks"]], ["Symptom management", ["Dalfampridine for walking; baclofen/tizanidine/botulinum toxin for spasticity", "Bladder therapy, fatigue management, depression treatment, PT/OT, exercise, vitamin D sufficiency, smoking cessation"]], ["Investigational", ["BTK inhibitors aimed at smoldering inflammation: tolebrutinib received an FDA complete response letter for non-relapsing SPMS (Dec 2025); others in phase 3"]]], "upd": ["Dec 2025: FDA declined to approve tolebrutinib for non-relapsing secondary progressive MS (complete response letter)."], "tags": ["numbness", "vision", "weakness", "fatigue", "gait", "dizziness"], "refs": [["Montalban X, et al. Diagnosis of multiple sclerosis: 2024 revisions of the McDonald criteria. Lancet Neurol. 2025", "https://pubmed.ncbi.nlm.nih.gov/?term=Diagnosis%20of%20multiple%20sclerosis%3A%202024%20revisions%20of%20the%20McDonald%20criteria"], ["Rae-Grant A, et al. Practice guideline: Disease-modifying therapies for adults with MS (AAN). Neurology. 2018", "https://pubmed.ncbi.nlm.nih.gov/?term=Practice%20guideline%20recommendations%20summary%3A%20Disease-modifying%20therapies%20for%20adults%20with%20multiple%20sclerosis"], ["Multiple Sclerosis News Today: FDA denies tolebrutinib approval (Dec 2025)", "https://multiplesclerosisnewstoday.com/news-posts/2025/12/29/fda-denies-tolebrutinib-approval-nonrelapsing-progressive-ms/"], ["National MS Society", "https://www.nationalmssociety.org/"], ["MedlinePlus: Multiple Sclerosis", "https://medlineplus.gov/multiplesclerosis.html"]], "ddx": [["Neuromyelitis optica spectrum disorder", "Optic neuritis and myelitis in young adults", "NMOSD: AQP4-IgG, long spinal lesions (≥3 segments), severe attacks, area postrema syndrome; some MS drugs worsen NMOSD"], ["MOG antibody-associated disease", "Optic neuritis, myelitis, brain lesions", "MOG-IgG, bilateral optic disc swelling, fluffy lesions that often resolve; ADEM in children"], ["Nonspecific white-matter spots (migraine, small-vessel disease)", "White-matter lesions on MRI", "Small, subcortical, not periventricular/juxtacortical/infratentorial/spinal; no central vein sign; no clinical attacks — a common cause of misdiagnosis"], ["Vitamin B12 or copper deficiency", "Spinal cord symptoms, numbness, imbalance", "Symmetric dorsal-column involvement, low B12/copper, anemia; reversible"], ["Neurosarcoidosis, CNS vasculitis, Lyme, Sjögren's", "Multifocal CNS lesions", "Systemic features, meningeal or leptomeningeal enhancement, abnormal blood tests"], ["Functional neurological disorder", "Numbness, weakness, fatigue", "Positive functional signs and normal MRI; can coexist with MS"]]}, "nmosd": {"id": "nmosd", "name": "Neuromyelitis Optica Spectrum Disorder (NMOSD)", "aka": "NMO, Devic disease", "ov": "Autoimmune astrocytopathy usually caused by aquaporin-4 antibodies (AQP4-IgG). Attacks are severe and disability accumulates with each relapse, so relapse prevention is critical. More common in women and people of Asian and African descent.", "sx": ["Severe optic neuritis (often bilateral or with poor recovery)", "Longitudinally extensive transverse myelitis (weakness, sensory level, bladder dysfunction)", "Area postrema syndrome: intractable hiccups, nausea and vomiting", "Brainstem, diencephalic or cerebral syndromes"], "early": ["Unexplained persistent hiccups or vomiting followed by neurological symptoms", "Optic neuritis with very poor vision"], "dx": ["AQP4-IgG by cell-based assay; MOG-IgG if negative", "MRI: spinal lesions spanning ≥3 vertebral segments"], "tx": [["Acute attacks", ["High-dose IV methylprednisolone with early plasma exchange"]], ["Relapse prevention (AQP4+)", ["FDA-approved: eculizumab, ravulizumab (complement C5), inebilizumab (anti-CD19), satralizumab (anti-IL-6R)", "Off-label: rituximab, azathioprine, mycophenolate", "Some MS drugs (interferon-β, fingolimod, natalizumab) can worsen NMOSD — accurate diagnosis matters"]]], "tags": ["vision", "weakness", "numbness", "hiccups"], "refs": [["Wingerchuk DM, et al. International consensus diagnostic criteria for NMOSD. Neurology. 2015", "https://pubmed.ncbi.nlm.nih.gov/?term=International%20consensus%20diagnostic%20criteria%20for%20neuromyelitis%20optica%20spectrum%20disorders"], ["MedlinePlus: Neuromyelitis optica", "https://vsearch.nlm.nih.gov/vivisimo/cgi-bin/query-meta?v%3Aproject=medlineplus&v%3Asources=medlineplus-bundle&query=neuromyelitis%20optica"]], "ddx": [["Multiple sclerosis", "Optic neuritis and myelitis", "MS: short cord lesions, periventricular ovoid brain lesions, oligoclonal bands, milder attacks with better recovery"], ["MOGAD", "Optic neuritis and myelitis", "AQP4 negative, MOG positive; often better recovery, conus involvement, optic disc swelling"], ["Gastrointestinal illness", "Nausea, vomiting, hiccups", "Area postrema syndrome is intractable (>48 h) and unexplained; MRI shows dorsal medulla lesion"]]}, "mogad": {"id": "mogad", "name": "MOG Antibody-Associated Disease (MOGAD)", "aka": "MOGAD", "ov": "Inflammatory demyelinating disease with antibodies to myelin oligodendrocyte glycoprotein. Common in children (often as ADEM) and adults (optic neuritis, myelitis). About half have a monophasic course.", "sx": ["Optic neuritis, often bilateral with marked optic disc swelling", "Transverse myelitis, sometimes conus involvement with bladder/bowel problems", "ADEM in children: encephalopathy with multifocal deficits; cortical encephalitis with seizures"], "early": ["Severe painful vision loss with disc swelling; encephalopathy after infection in a child"], "dx": ["MOG-IgG by cell-based assay (2023 international MOGAD criteria)", "MRI and CSF"], "tx": [["Acute", ["High-dose steroids with slow taper; IVIG or plasma exchange if severe"]], ["Relapsing disease", ["Maintenance IVIG, rituximab, azathioprine or mycophenolate; targeted therapies (IL-6 and FcRn blockers) under study"]]], "tags": ["vision", "weakness", "confusion"], "refs": [["Banwell B, et al. Diagnosis of MOGAD: International MOGAD Panel proposed criteria. Lancet Neurol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=Diagnosis%20of%20myelin%20oligodendrocyte%20glycoprotein%20antibody-associated%20disease%3A%20International%20MOGAD%20Panel%20proposed%20criteria"]], "ddx": [["Multiple sclerosis", "Relapsing demyelination", "MOGAD lesions are larger, fluffier and often vanish; oligoclonal bands usually absent; MOG-IgG positive"], ["NMOSD", "Severe optic neuritis and myelitis", "AQP4-IgG positive in NMOSD; MOGAD has more optic disc swelling and better recovery"], ["Viral encephalitis", "Encephalopathy with fever in a child", "Viral PCR in CSF; MRI pattern; ADEM follows infection by 1–3 weeks"]]}, "autoimmune-encephalitis": {"id": "autoimmune-encephalitis", "name": "Autoimmune Encephalitis", "aka": "Anti-NMDA receptor, LGI1 encephalitis", "ov": "Brain inflammation caused by antibodies to neuronal surface or intracellular proteins. Anti-NMDAR encephalitis (young women, often with ovarian teratoma) and LGI1 encephalitis (older adults) are the most common. Highly treatable if recognized early.", "sx": ["Anti-NMDAR: psychiatric symptoms (anxiety, psychosis), then seizures, abnormal movements (orofacial dyskinesias), decreased consciousness, autonomic instability, central hypoventilation", "LGI1: memory loss, confusion, faciobrachial dystonic seizures (brief arm/face jerks), low sodium", "Subacute onset over less than 3 months"], "early": ["New-onset psychosis in a young person with seizures or abnormal movements", "Frequent brief one-sided face/arm jerks in an older adult (LGI1)"], "dx": ["Graus 2016 clinical criteria — treatment can start before antibody results", "MRI, EEG (extreme delta brush in NMDAR), CSF (pleocytosis, oligoclonal bands)", "Serum and CSF neuronal antibody panel; tumor search (pelvic imaging for teratoma)"], "tx": [["First-line", ["High-dose steroids, IVIG and/or plasma exchange", "Tumor removal when present"]], ["Second-line", ["Rituximab or cyclophosphamide if insufficient response", "Long-term immunotherapy for relapsing disease; rehabilitation for cognitive recovery"]]], "tags": ["confusion", "seizures", "behavior change", "memory loss", "psychosis"], "refs": [["Graus F, et al. A clinical approach to diagnosis of autoimmune encephalitis. Lancet Neurol. 2016", "https://pubmed.ncbi.nlm.nih.gov/?term=A%20clinical%20approach%20to%20diagnosis%20of%20autoimmune%20encephalitis"], ["Titulaer MJ, et al. Treatment and prognostic factors for long-term outcome in anti-NMDAR encephalitis. Lancet Neurol. 2013", "https://pubmed.ncbi.nlm.nih.gov/?term=Treatment%20and%20prognostic%20factors%20for%20long-term%20outcome%20in%20patients%20with%20anti-NMDA%20receptor%20encephalitis"]], "ddx": [["Herpes simplex encephalitis", "Confusion, seizures, temporal lobe involvement", "Fever, HSV PCR in CSF — start acyclovir until excluded; HSV can trigger anti-NMDAR encephalitis afterward"], ["Primary psychiatric illness", "New psychosis, agitation, catatonia", "Absence of seizures, movement disorders, autonomic instability; normal CSF/EEG"], ["Neuroleptic malignant syndrome", "Rigidity, fever, autonomic instability, altered mental state", "Follows antipsychotic exposure; very high CK — and anti-NMDAR patients are prone to it"], ["Creutzfeldt-Jakob disease", "Rapidly progressive dementia, myoclonus", "RT-QuIC positive, DWI ribboning, no response to immunotherapy"]]}, "myasthenia-gravis": {"id": "myasthenia-gravis", "name": "Myasthenia Gravis (MG)", "aka": "MG, generalized and ocular", "ov": "Autoimmune disease in which antibodies (usually against the acetylcholine receptor, AChR, or MuSK) block nerve–muscle transmission, causing fatigable weakness. Bimodal onset (young women, older men). Rapidly expanding range of targeted therapies.", "sx": ["Drooping eyelids (ptosis) and double vision — often first and worse at day's end", "Fatigable weakness of face, jaw, neck, arms or legs", "Slurred or nasal speech, chewing and swallowing difficulty", "Shortness of breath (myasthenic crisis)"], "early": ["Ptosis or diplopia that fluctuates, worsens with fatigue and improves with rest or ice pack", "Jaw tiring while chewing"], "red": ["Breathing or swallowing difficulty — emergency (myasthenic crisis)"], "dx": ["AChR antibodies; MuSK and LRP4 if negative", "Repetitive nerve stimulation and single-fiber EMG", "Chest CT for thymoma"], "tx": [["Symptomatic", ["Pyridostigmine"]], ["Immunotherapy", ["Corticosteroids, then steroid-sparing agents (azathioprine, mycophenolate, tacrolimus)", "Complement inhibitors (AChR+): eculizumab, ravulizumab, zilucoplan (daily SC), gefurulimab (approved Nov 2026), cemdisiran (Livsayis) — subcutaneous siRNA dosed every 3 months (approved Nov 18, 2026)", "FcRn blockers: efgartigimod (IV and SC), rozanolixizumab, nipocalimab (Imaavy, approved Apr 2025 for AChR+ or MuSK+ patients ≥12 years)", "Rituximab — especially effective in MuSK-MG", "Thymectomy for AChR+ generalized MG (age ~18–65) and all thymomas"]], ["Crisis & safety", ["IVIG or plasma exchange for crisis or pre-surgery; ICU monitoring of breathing", "Avoid/use cautiously: fluoroquinolones, aminoglycosides, magnesium IV, telithromycin, some β-blockers, immune checkpoint inhibitors"]]], "upd": ["Nov 2026: FDA approved cemdisiran (Livsayis), the first siRNA therapy for AChR+ generalized MG, and gefurulimab (Klygefa), a C5-targeting nanobody.", "Apr 2025: FDA approved nipocalimab (Imaavy), an FcRn blocker for AChR+ and MuSK+ gMG in patients 12 and older."], "tags": ["weakness", "double vision", "drooping eyelid", "swallowing", "speech", "fatigue"], "refs": [["Narayanaswami P, et al. International Consensus Guidance for Management of Myasthenia Gravis: 2020 Update. Neurology. 2021", "https://pubmed.ncbi.nlm.nih.gov/?term=International%20Consensus%20Guidance%20for%20Management%20of%20Myasthenia%20Gravis%3A%202020%20Update"], ["NeurologyLive: FDA Approves Cemdisiran for Generalized MG (Nov 2026)", "https://www.neurologylive.com/view/fda-approves-cemdisiran-as-new-treatment-generalized-myasthenia-gravis"], ["AJMC: FDA Approves Nipocalimab for Generalized Myasthenia Gravis (2025)", "https://www.ajmc.com/view/fda-approves-nipocalimab-for-generalized-myasthenia-gravis"], ["Wolfe GI, et al. Randomized Trial of Thymectomy in Myasthenia Gravis (MGTX). N Engl J Med. 2016", "https://pubmed.ncbi.nlm.nih.gov/?term=Randomized%20Trial%20of%20Thymectomy%20in%20Myasthenia%20Gravis"], ["MedlinePlus: Myasthenia Gravis", "https://medlineplus.gov/myastheniagravis.html"]], "ddx": [["Lambert-Eaton myasthenic syndrome", "Fluctuating weakness", "LEMS: legs more than eyes, reduced reflexes that improve after exercise, dry mouth; VGCC antibodies; cancer link"], ["Botulism", "Ptosis, diplopia, bulbar weakness", "Rapid descending paralysis, dilated unreactive pupils, autonomic signs; food/wound exposure"], ["Thyroid eye disease", "Double vision", "Proptosis, eyelid retraction (not ptosis), thyroid antibodies; enlarged eye muscles on imaging"], ["Third-nerve palsy or brainstem stroke", "Ptosis and double vision", "Fixed, not fatigable; pupil may be involved; other brainstem signs"], ["ALS (bulbar onset)", "Slurred speech and swallowing difficulty", "Progressive without fluctuation, tongue wasting/fasciculations, no ptosis"]]}, "lems": {"id": "lems", "name": "Lambert-Eaton Myasthenic Syndrome (LEMS)", "aka": "LEMS", "ov": "Autoimmune disorder with antibodies to presynaptic voltage-gated calcium channels; about half are paraneoplastic, usually from small-cell lung cancer.", "sx": ["Proximal leg weakness (trouble rising from a chair, climbing stairs)", "Dry mouth, constipation, erectile dysfunction (autonomic)", "Reduced reflexes that improve briefly after exercise"], "early": ["Hip-girdle weakness with dry mouth in a smoker"], "dx": ["P/Q-type VGCC antibodies; repetitive nerve stimulation shows increment after exercise", "CT chest/PET for small-cell lung cancer, repeated periodically"], "tx": [["Treatment", ["Treat underlying cancer", "Amifampridine (3,4-diaminopyridine)", "Immunotherapy: steroids, azathioprine, IVIG for refractory cases"]]], "tags": ["weakness", "dry mouth"], "refs": [["Kesner VG, et al. Lambert-Eaton Myasthenic Syndrome. Neurol Clin. 2018", "https://pubmed.ncbi.nlm.nih.gov/?term=Lambert-Eaton%20Myasthenic%20Syndrome%20review%20Neurologic%20Clinics%202018"]], "ddx": [["Myasthenia gravis", "Fatigable weakness", "MG: eye and bulbar onset, normal reflexes, AChR/MuSK antibodies, decrement on repetitive stimulation"], ["Inflammatory myopathy", "Proximal leg weakness", "Elevated CK, myopathic EMG, rash in dermatomyositis; normal reflexes"], ["Botulism", "Weakness with dry mouth and autonomic features", "Acute, descending, cranial nerves first"]]}, "gbs": {"id": "gbs", "name": "Guillain-Barré Syndrome (GBS)", "aka": "Acute inflammatory demyelinating polyneuropathy", "ov": "Acute immune-mediated polyneuropathy, often 1–4 weeks after an infection (Campylobacter, flu-like illness, Zika, CMV). Weakness peaks within 4 weeks. Most recover, but up to 25% need mechanical ventilation.", "sx": ["Rapidly ascending symmetric weakness (legs then arms), difficulty walking", "Tingling in feet and hands; back or leg pain", "Loss of reflexes", "Facial weakness, swallowing difficulty, breathing difficulty", "Autonomic instability (heart rate, BP)"], "early": ["Tingling in toes and fingers followed by leg weakness over days after a recent infection"], "red": ["Breathing difficulty or rapidly progressive weakness — emergency; vital capacity monitoring"], "dx": ["Clinical; nerve conduction studies", "CSF: high protein with normal cell count (albuminocytologic dissociation)", "Monitor forced vital capacity and negative inspiratory force"], "tx": [["Treatment", ["IVIG (0.4 g/kg/day for 5 days) or plasma exchange — equally effective; corticosteroids are not effective", "ICU monitoring; ventilation if FVC <20 mL/kg", "DVT prophylaxis, pain control, cardiac monitoring, early rehabilitation"]]], "tags": ["weakness", "numbness", "tingling", "emergency"], "refs": [["van Doorn PA, et al. EAN/PNS Guideline on diagnosis and treatment of GBS. Eur J Neurol. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=European%20Academy%20of%20Neurology%2FPeripheral%20Nerve%20Society%20Guideline%20on%20diagnosis%20and%20treatment%20of%20Guillain-Barr%C3%A9%20syndrome"], ["MedlinePlus: Guillain-Barré Syndrome", "https://medlineplus.gov/guillainbarresyndrome.html"]], "ddx": [["Acute-onset CIDP", "Demyelinating weakness and areflexia", "Continued worsening or relapse beyond 8 weeks or ≥3 treatment-related fluctuations suggests CIDP"], ["Transverse myelitis or cord compression", "Rapid leg weakness", "Sensory level, early bladder dysfunction, brisk reflexes later; MRI spinal lesion"], ["Myasthenia gravis crisis", "Weakness with breathing difficulty", "Ptosis/diplopia, normal reflexes and sensation"], ["Botulism", "Acute paralysis with bulbar features", "Descending (not ascending), dilated pupils, preserved sensation"], ["Tick paralysis", "Ascending weakness with areflexia", "Tick found on the scalp or body; rapid recovery after removal"]]}, "cidp": {"id": "cidp", "name": "Chronic Inflammatory Demyelinating Polyneuropathy (CIDP)", "aka": "CIDP", "ov": "Immune-mediated neuropathy that progresses or relapses over more than 8 weeks, causing proximal and distal weakness and sensory loss. Treatable — often responds well to immunotherapy.", "sx": ["Symmetric weakness of arms and legs, including proximal muscles", "Numbness, tingling, imbalance", "Reduced or absent reflexes"], "early": ["Gradually worsening leg weakness and numbness over months"], "dx": ["Nerve conduction studies showing demyelination (EAN/PNS 2021 criteria)", "CSF protein, nerve ultrasound or MRI; test for paraproteins and nodal/paranodal antibodies"], "tx": [["Treatment", ["IVIG or subcutaneous immunoglobulin", "Corticosteroids", "Plasma exchange", "Efgartigimod alfa-hyaluronidase (Vyvgart Hytrulo) — FcRn blocker approved for CIDP in 2024", "Rituximab for antibody-mediated (nodopathy) forms; PT"]]], "tags": ["weakness", "numbness", "tingling", "gait"], "refs": [["Van den Bergh PYK, et al. EAN/PNS guideline on diagnosis and treatment of CIDP. J Peripher Nerv Syst. 2021", "https://pubmed.ncbi.nlm.nih.gov/?term=European%20Academy%20of%20Neurology%2FPeripheral%20Nerve%20Society%20guideline%20on%20diagnosis%20and%20treatment%20of%20chronic%20inflammatory%20demyelinating%20polyradiculoneuropathy"], ["Allen JA, et al. Safety and efficacy of efgartigimod PH20 in CIDP (ADHERE). Lancet Neurol. 2024", "https://pubmed.ncbi.nlm.nih.gov/?term=Safety%2C%20tolerability%2C%20and%20efficacy%20of%20subcutaneous%20efgartigimod%20in%20patients%20with%20chronic%20inflammatory%20demyelinating%20polyradiculoneuropathy%20(ADHERE)"]], "ddx": [["Diabetic or other length-dependent neuropathy", "Numbness and weakness", "Starts in toes, sensory-predominant, axonal on nerve studies; CIDP has proximal weakness and demyelination"], ["Hereditary transthyretin amyloidosis", "Progressive neuropathy, sometimes misread as demyelinating", "Autonomic symptoms, carpal tunnel, weight loss, cardiomyopathy, no IVIG response; TTR gene test"], ["Paraprotein neuropathy (anti-MAG, POEMS)", "Demyelinating neuropathy", "Monoclonal protein; POEMS has high VEGF, organomegaly, skin changes; different treatment"], ["Multifocal motor neuropathy", "Treatable immune neuropathy", "Pure motor, asymmetric, conduction block; steroids may worsen it"]]}, "aag": {"id": "aag", "name": "Autoimmune Autonomic Ganglionopathy (AAG)", "aka": "Autoimmune autonomic neuropathy", "ov": "An immune-mediated disorder in which antibodies against the ganglionic acetylcholine receptor block transmission in autonomic ganglia, causing subacute widespread autonomic failure. Can follow infection or be paraneoplastic. Potentially reversible with immunotherapy.", "sx": ["Severe orthostatic hypotension", "GI dysmotility: severe constipation, early satiety, vomiting, ileus", "Urinary retention, dry eyes and mouth, reduced sweating", "Pupils that react poorly to light; blurred near vision"], "early": ["Subacute onset over days to weeks of combined orthostatic, GI and dry-eye/mouth symptoms, often after an infection"], "dx": ["Ganglionic AChR (α3) antibodies; autonomic testing", "Cancer screening (paraneoplastic forms)"], "tx": [["Treatment", ["Immunotherapy: IVIG, plasma exchange, corticosteroids; rituximab or mycophenolate for maintenance", "Symptomatic treatment of orthostatic hypotension, GI and bladder dysfunction", "Pyridostigmine may help some symptoms"]]], "tags": ["dizziness", "fainting", "constipation", "dry mouth"], "refs": [["Vernino S, et al. Autoantibodies to ganglionic acetylcholine receptors in autoimmune autonomic neuropathies. N Engl J Med. 2000", "https://pubmed.ncbi.nlm.nih.gov/?term=Autoantibodies%20to%20ganglionic%20acetylcholine%20receptors%20in%20autoimmune%20autonomic%20neuropathies"]], "ddx": [["Pure autonomic failure", "Widespread autonomic failure", "PAF is slowly progressive over years without antibodies; AAG is subacute with prominent GI and pupil involvement"], ["Paraneoplastic autonomic neuropathy", "Subacute autonomic failure", "ANNA-1 (anti- // ===== Big-picture concepts =====
const CONCEPTS = [
["Shared genes, different targets","Most risk genes are not disease-specific: they set how easily the immune system is switched on (PTPN22, CTLA4, IL2RA, TYK2). Which organ is attacked depends largely on HLA type — which self-peptides get shown to T cells — plus local triggers."],
["The 'mosaic' and polyautoimmunity","About a quarter of people with one autoimmune disease develop another. The clusters are predictable: thyroid–T1D–celiac–Addison's (HLA-DR3/DQ2); psoriasis–PsA–IBD–uveitis–axSpA (IL-23/HLA-B27); lupus–Sjögren's–APS–cytopenias (interferon/B-cell)."],
["Autoimmunity starts years before disease","Autoantibodies often appear years before symptoms: islet antibodies before T1D, anti-CCP up to a decade before RA, ANA years before lupus, TPO antibodies before hypothyroidism. This 'preclinical' window is now a treatment target (teplizumab in stage 2 T1D; abatacept in at-risk RA)."],
["Molecular mimicry","Infections can teach the immune system to attack lookalike self-proteins: strep and the heart (rheumatic fever), Campylobacter and nerves (Guillain–Barré), EBV and myelin proteins (MS)."],
["Breaking the brakes","Single-gene defects (AIRE, FOXP3, CTLA4) and checkpoint-inhibitor drugs show that tolerance is actively maintained. Release the brakes and autoimmunity appears in many organs at once."],
["Same drug, opposite effects","Pathways behave differently by tissue: IL-17 blockers help psoriasis but worsen Crohn's; IL-23 blockers help Crohn's but not axSpA; TNF blockers help RA but worsen MS; interferon-β helps MS but interferon-α can trigger lupus."],
["Autoimmune vs autoinflammatory","Classic autoimmune disease is driven by adaptive immunity (T and B cells against specific self-antigens). Autoinflammatory disease (FMF, Still's, VEXAS) is driven by innate immunity without autoantibodies. Many common conditions — psoriasis, IBD, axSpA — sit in between."],
["Why women?","Roughly 4 in 5 people with autoimmune disease are women. Two X chromosomes (with immune genes that escape silencing), estrogen effects on B cells, and the XIST RNA–protein complex acting as an autoantigen all contribute; pregnancy changes disease activity."]];

function drawNet() {
  const svg = $("#net"); if (!svg) return;
  const N = DIS.length, gap = 0.035, R = 330, C = 500;
  const nAreas = AREAS.length, span = 2 * Math.PI - gap * nAreas;
  const pos = {}; let k = 0;
  AREAS.forEach((a, ai) => a.subs.forEach(s => s.diseases.forEach(d => { const ang = -Math.PI / 2 + ai * gap + (k + 0.5) * span / N; pos[d.id] = {a: ang, x: C + R * Math.cos(ang), y: C + R * Math.sin(ang)}; k++; })));
  const deg = id => relsOf(id).filter(r => NET.types.has(r.t)).length;
  const sel = NET.sel, rs = RELS.filter(r => NET.types.has(r[2]));
  const linked = new Set(sel ? relsOf(sel).filter(r => NET.types.has(r.t)).map(r => r.o).concat(sel) : []);
  const col = d => NET.color === "area" ? d.area.color : MECH[d.m.mech].color;
  let h = "";
  // area arcs
  AREAS.forEach(a => { const ids = a.subs.flatMap(s => s.diseases.map(d => d.id)); const a0 = pos[ids[0]].a - span / N / 2 + 0.004, a1 = pos[ids[ids.length - 1]].a + span / N / 2 - 0.004, r = R - 22;
    h += `<path d="M${C + r * Math.cos(a0)} ${C + r * Math.sin(a0)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${C + r * Math.cos(a1)} ${C + r * Math.sin(a1)}" stroke="${a.color}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"><title>${esc(a.name)}</title></path>`; });
  rs.forEach(([p, q, t, n]) => { const A = pos[p], B = pos[q]; const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, cx = C + (mx - C) * 0.3, cy = C + (my - C) * 0.3;
    const on = sel && (p === sel || q === sel); const op = sel ? (on ? 0.9 : 0.05) : 0.32;
    h += `<path class="edge" d="M${A.x} ${A.y} Q${cx} ${cy} ${B.x} ${B.y}" stroke="${REL_TYPES[t][1]}" stroke-width="${on ? 2.6 : 1.3}" fill="none" opacity="${op}"><title>${esc(BYID[p].m.abbr)} – ${esc(BYID[q].m.abbr)}: ${esc(n)}</title></path>`; });
  DIS.forEach(d => { const P = pos[d.id], dim = sel && !linked.has(d.id), r = 5 + Math.sqrt(deg(d.id)) * 1.4;
    const deg2 = P.a * 180 / Math.PI, flip = Math.cos(P.a) < 0, lx = C + (R + r + 8) * Math.cos(P.a), ly = C + (R + r + 8) * Math.sin(P.a);
    h += `<g class="node${d.id === sel ? " sel" : ""}" data-n="${d.id}" opacity="${dim ? 0.25 : 1}" tabindex="0" role="button" aria-label="${esc(d.name)}"><circle cx="${P.x}" cy="${P.y}" r="${r}" fill="${col(d)}" stroke="var(--panel)" stroke-width="1.5"/><text x="${lx}" y="${ly}" transform="rotate(${flip ? deg2 + 180 : deg2} ${lx} ${ly})" text-anchor="${flip ? "end" : "start"}" dominant-baseline="middle" font-weight="${d.id === sel || linked.has(d.id) ? 700 : 500}">${esc(d.m.abbr)}</text><title>${esc(d.name)} — ${deg(d.id)} links</title></g>`; });
  svg.innerHTML = h;
  $("#netlegend").innerHTML = NET.color === "area" ? AREAS.map(a => `<span><span class="lg" style="background:${a.color}"></span>${esc(a.short)}</span>`).join("") : Object.values(MECH).map(m => `<span><span class="lg" style="background:${m.color}"></span>${esc(m.short)}</span>`).join("");
  const info = $("#netinfo");
  if (!sel) { const top = DIS.map(d => [d, deg(d.id)]).sort((a, b) => b[1] - a[1]).slice(0, 8);
    info.innerHTML = `<h3>Most connected conditions</h3><div class="chipline">${top.map(([d, n]) => `<button class="dchip pick" data-pick="${d.id}" style="--c:${d.area.color}"><span class="dot" style="background:${d.area.color}"></span>${esc(d.m.abbr)} · ${n}</button>`).join("")}</div><p class="secnote" style="margin:10px 0 0">Or pick any condition: <select id="netpick"><option value="">Choose…</option>${DIS.slice().sort((a, b) => a.name.localeCompare(b.name)).map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select></p>`; return; }
  const d = BYID[sel], v = relsOf(sel).filter(r => NET.types.has(r.t));
  info.innerHTML = `<h3><a href="#${d.id}">${esc(d.name)} →</a></h3><div class="muted" style="margin:-4px 0 8px">${esc(d.area.name)} · ${esc(MECH[d.m.mech].name)} · ${v.length} links shown</div>
    ${v.map(r => `<div class="cxrow"><span class="lg" title="${esc(REL_TYPES[r.t][0])}" style="background:${REL_TYPES[r.t][1]}"></span>${dchip(r.o)}<span>${esc(r.n)}</span></div>`).join("") || `<p class="muted">No links of the selected types.</p>`}`;
}
function netEvents() {
  const card = $(".netcard"); if (!card) return;
  card.addEventListener("click", e => {
    const t = e.target.closest("[data-rt]"); if (t) { const k = t.dataset.rt; NET.types.has(k) ? NET.types.delete(k) : NET.types.add(k); t.classList.toggle("on"); drawNet(); return; }
    const c = e.target.closest("[data-col]"); if (c) { NET.color = c.dataset.col; card.querySelectorAll("[data-col]").forEach(b => b.classList.toggle("on", b === c)); drawNet(); return; }
    const p = e.target.closest("[data-pick]"); if (p) { NET.sel = p.dataset.pick; drawNet(); return; }
    const n = e.target.closest(".node"); if (n) { NET.sel = NET.sel === n.dataset.n ? null : n.dataset.n; drawNet(); return; }
    if (e.target.closest("svg")) { NET.sel = null; drawNet(); }
  });
  card.addEventListener("change", e => { if (e.target.id === "netpick" && e.target.value) { NET.sel = e.target.value; drawNet(); } });
  card.addEventListener("keydown", e => { const n = e.target.closest(".node"); if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); NET.sel = n.dataset.n; drawNet(); } });
}

  <h1>What's new</h1>
  <p class="lede">Approvals, safety actions, and guideline changes across all specialties, newest first (${items.length} items). Each links to the condition page and its sources.</p>
  <div class="card k-early" style="margin:6px 0 10px"><h3>Decisions to watch</h3><ul class="clean">${WATCH.map(([t, id]) => `<li>${esc(t)}${id && BYID[id] ? ` · <a href="#${id}" style="color:var(--accent);text-decoration:none">${esc(short(BYID[id].name))}</a>` : ""}</li>`).join("")}</ul></div>
  <h2>All dated updates</h2>
  <div class="updlist">${items.map(x => `
    <div class="u"><time>${esc(x.u.split(":")[0])}</time><div><a href="${x.href}">${esc(x.name)}</a> <span class="spec" style="--c:${x.c}">${esc(x.spec)}</span><div style="font-size:14px;margin-top:3px">${esc(x.u.slice(x.u.indexOf(":") + 2))}</div></div></div>`).join("")}
  </div>
  <div class="disc">Items were checked against news, regulatory, and guideline sources in November 2026. Other recent changes may exist; confirm with prescribing information before acting.</div>`;
}

function vAbout() {
  return `
  <div class="crumbs"><a href="#home">Home</a> › About &amp; sources</div>
  <h1>About &amp; sources</h1>
  <p class="lede">AutoimmuneAtlas is a plain-language reference that gathers autoimmune and immune-mediated diseases from rheumatology, endocrinology, gastroenterology and hepatology, neurology, dermatology, hematology, nephrology, ophthalmology and clinical immunology in one place, and maps how they relate. It is a companion to <a href="https://ojlise.github.io/rheumatology/" target="_blank" rel="noopener" style="color:var(--accent)">RheumAtlas</a> and <a href="https://ojlise.github.io/neurology/" target="_blank" rel="noopener" style="color:var(--accent)">NeuroAtlas</a>; conditions shared with them link to their specialty pages.</p>
  <div class="card"><h3>Each condition page includes</h3>${list(["Specialty, main immune mechanism, key antibodies, and who is typically affected","Symptoms, early clues, red flags, diagnosis, and look-alike conditions","Connections: diseases that occur alongside it, shared genes, shared triggers, and drugs that act on the same pathway","Treatment, complementary approaches where studied, dated updates, and references"])}</div>
  <h2>What counts as autoimmune here</h2>
  <div class="card"><p style="margin:0">Classic autoimmune diseases have a defined self-antigen and adaptive (T- and B-cell) immunity. The atlas also includes closely related immune-mediated diseases — psoriasis, IBD, spondyloarthritis, uveitis, giant cell arteritis, IgG4-related disease — because they share genes, mechanisms and drugs with autoimmune disease and frequently co-occur with it. Purely autoinflammatory conditions (FMF, Still's disease, VEXAS) are covered in RheumAtlas.</p></div>
  <h2>Limitations</h2>
  <div class="card">${list(["Figures for how often diseases co-occur are approximate and vary between populations and studies", "Drug approvals, boxed warnings, and guideline versions change; check current prescribing information", "Recent approvals were checked against news and regulatory sources in November 2026; content has not been reviewed by a clinician", "Some reference links open a PubMed search for the cited title rather than the article page"], "var(--amber)")}</div>
  <div class="disc">For emergencies, call your local emergency number. This site does not provide medical advice.</div>`;
}

const hay = d => (d.name + " " + (d.aka || "") + " " + d.tags.join(" ") + " " + d.ov + " " + (d.m.ab || "") + " " + d.tx.map(t => t[0] + " " + t[1].join(" ")).join(" ")).toLowerCase();
DIS.forEach(d => { d._h = hay(d); d._ha = (d.alt || []).map(i => i.t + " " + i.n).join(" ").toLowerCase(); d._n = (d.name + " " + (d.aka || "") + " " + (d.m.abbr || "")).toLowerCase(); });
function search(q) {
  const s = q.trim().toLowerCase();
  if (s.length < 2) return [];
  return DIS.map(d => ({d, r: d._n.includes(s) ? 0 : d.tags.some(t => t.includes(s)) ? 1 : d._h.includes(s) ? 2 : ALT_ON && d._ha.includes(s) ? 3 : 9})).filter(x => x.r < 9).sort((a, b) => a.r - b.r).slice(0, 10);
}

function render(keep) {
  let id = location.hash.slice(1) || "home";
  document.body.classList.remove("nav");
  let anchor = null, focus = null;
  if (id.startsWith("mech-")) { focus = id.slice(5); anchor = id; id = "mechanisms"; }
  if (["genes", "targets", "triggers", "map"].includes(id)) { anchor = id; id = "connections"; }
  document.querySelectorAll(".toplinks a").forEach(a => a.classList.toggle("on", a.dataset.v === id));
  const views = {complementary: vComplementary, home: vHome, connections: vConnect, mechanisms: () => vMech(focus), symptoms: vSymptoms, labs: vLabs, drugs: vDrugs, emerging: vEmerging, updates: vUpdates, about: vAbout};
  let html, cur = id;
  if (views[id]) html = views[id]();
  else {
    const a = AREAS.find(x => x.id === id), d = BYID[id];
    if (a) html = vArea(a); else if (d) html = vDisease(d); else { html = vHome(); cur = "home"; }
  }
  $view.innerHTML = html;
  renderSide(cur);
  if (id === "connections") { drawNet(); netEvents(); }
  if (anchor) { const el = document.getElementById(anchor); if (el) setTimeout(() => el.scrollIntoView({block: "start"}), 0); }
  else if (!keep) window.scrollTo({top: 0});
}
window.addEventListener("hashchange", () => render());

$view.addEventListener("click", e => {
  const f = e.target.closest("[data-focus]");
  if (f) { NET.sel = f.dataset.focus; e.preventDefault(); location.hash = "map"; return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const el = document.getElementById("sec-" + j.dataset.jump); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); return; }
  if (e.target.closest("[data-clear]")) { e.preventDefault(); picked.clear(); $view.innerHTML = vSymptoms(); return; }
  const c = e.target.closest(".chip[data-t]");
  if (!c) return;
  const t = c.dataset.t;
  picked.has(t) ? picked.delete(t) : picked.add(t);
  const y = window.scrollY; $view.innerHTML = vSymptoms(); window.scrollTo({top: y});
});

$q.addEventListener("input", () => {
  if (!$q.value.trim()) { $res.classList.remove("show"); return; }
  const hits = search($q.value);
  $res.innerHTML = hits.length ? hits.map(({d, r}) => `<a class="res" href="#${d.id}"><b>${esc(d.name)}</b><small>${esc(d.area.name)} · ${esc(d.area.spec)}${r === 2 ? " · mentioned in overview, antibodies or treatment" : r === 3 ? " · complementary approaches" : ""}</small></a>`).join("") : `<div class="nores">No matches</div>`;
  $res.classList.add("show");
});
$q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const f = $res.querySelector("a"); if (f) { location.hash = f.getAttribute("href"); $q.value = ""; $res.classList.remove("show"); $q.blur(); } }
  if (e.key === "Escape") { $q.value = ""; $res.classList.remove("show"); $q.blur(); }
});
$res.addEventListener("click", () => { $res.classList.remove("show"); $q.value = ""; });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $q && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); $q.focus(); } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) $res.classList.remove("show"); });
$("#navbtn").addEventListener("click", () => document.body.classList.toggle("nav"));
$("#scrim").addEventListener("click", () => document.body.classList.remove("nav"));
applyAlt();
render();

</script>
</body>
</html>
