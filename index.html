<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoimmuneAtlas — An Interactive Guide to Autoimmune Disease Across Specialties</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1f23; --muted:#5f6670; --line:#e4e2dc; --soft:#f0eee9;
  --accent:#1971c2; --red:#c92a2a; --redbg:#fff1f0; --amber:#e67700; --amberbg:#fff8e6; --green:#2b8a3e; --greenbg:#eefaf0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --radius:12px; --serif:"Source Serif 4",Georgia,serif; --sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121417; --panel:#1a1d21; --ink:#e8e6e1; --muted:#a2a8b0; --line:#2c3036; --soft:#22262b;
  --redbg:#2a1717; --amberbg:#2a2214; --greenbg:#15241a; --shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--serif);font-size:21px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{display:block;font-size:11.5px;color:var(--muted);margin-top:-1px}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);max-height:70vh;overflow:auto;display:none;z-index:40}
.results.show{display:block}
.res{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;display:block}
.res:last-child{border-bottom:0}
.res:hover{background:var(--soft)}
.res b{display:block;font-weight:600}
.res small{color:var(--muted);font-size:12.5px}
.nores{padding:12px 14px;color:var(--muted);font-size:14px}
.navbtn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;cursor:pointer}
.toplinks{display:flex;gap:4px}
.toplinks a{padding:7px 11px;border-radius:8px;text-decoration:none;font-size:14px;color:var(--muted);font-weight:500}
.toplinks a:hover,.toplinks a.on{background:var(--soft);color:var(--ink)}
.layout{display:grid;grid-template-columns:290px 1fr;max-width:1400px;margin:0 auto;min-height:calc(100vh - 60px)}
aside.side{border-right:1px solid var(--line);padding:16px 10px 40px 14px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.side h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 8px 8px}
.sarea{margin-bottom:6px}
.sarea>a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}
.sarea>a:hover,.sarea>a.on{background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ssub{padding:2px 0 4px 18px}
.ssub .sl{font-size:11.5px;color:var(--muted);margin:8px 8px 3px;font-weight:600}
.ssub a{display:block;padding:4px 8px;border-radius:6px;font-size:13.5px;text-decoration:none;opacity:.85}
.ssub a:hover{background:var(--soft);opacity:1}
.ssub a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);opacity:1;font-weight:600}
main{padding:28px 36px 60px;min-width:0}
.wrap{max-width:980px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
h1{font-family:var(--serif);font-size:38px;line-height:1.12;margin:0 0 8px;letter-spacing:-.015em}
h2{font-family:var(--serif);font-size:24px;margin:34px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.lede{font-size:17px;color:var(--muted);max-width:760px;margin:0 0 18px}
.aka{color:var(--muted);font-size:14px;margin:-2px 0 14px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:44px}
.hero .stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.stat b{font-family:var(--serif);font-size:30px;display:block;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
a.card{text-decoration:none;display:block;transition:transform .12s,border-color .12s}
a.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c,var(--accent)) 55%,var(--line))}
.acard{border-top:4px solid var(--c)}
.acard b{font-family:var(--serif);font-size:18.5px;display:block;margin-bottom:4px;line-height:1.25}
.acard p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.acard .n{font-size:12px;font-weight:600;color:var(--c)}
.dcard b{display:block;font-weight:600;margin-bottom:3px}
.dcard p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--amberbg);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);margin-top:8px}
.emerg{background:var(--redbg);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:14px;padding:16px 20px;margin:18px 0}
.emerg h3{color:var(--red);margin-bottom:10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
ul.clean{margin:0;padding-left:0;list-style:none}
ul.clean li{position:relative;padding:5px 0 5px 22px;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.k-early{background:var(--amberbg);border-color:color-mix(in srgb,var(--amber) 28%,transparent)}
.k-early h3{color:var(--amber)}
.k-early li::before{background:var(--amber)!important}
.k-red{background:var(--redbg);border-color:color-mix(in srgb,var(--red) 28%,transparent)}
.k-red h3{color:var(--red)}
.k-red li::before{background:var(--red)!important}
.k-upd{background:var(--greenbg);border-color:color-mix(in srgb,var(--green) 28%,transparent)}
.k-upd h3{color:var(--green)}
.k-upd li::before{background:var(--green)!important}
.txg{margin-bottom:12px}
.txg h3{font-size:14.5px;padding-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--c) 30%,transparent)}
ol.refs{padding-left:22px;margin:0}
ol.refs li{margin-bottom:8px;font-size:14px}
ol.refs a{color:var(--accent);text-decoration:none;word-break:break-word}
ol.refs a:hover{text-decoration:underline}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.pager a{flex:1;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pager a:hover{border-color:var(--accent)}
.pager small{color:var(--muted);font-size:12px;display:block}
.updlist .u{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.updlist .u:last-child{border:0}
.updlist time{font-size:13px;color:var(--muted);font-weight:600}
.updlist a{color:var(--accent);font-size:13.5px;text-decoration:none;font-weight:500}
.disc{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:46px;padding-top:16px}
.hit{font-size:13px;color:var(--muted);margin:14px 0 6px}
.hit b{color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px;position:sticky;top:57px;z-index:5;background:var(--bg);padding:8px 0}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500;color:var(--muted)}
.pill:hover{color:var(--ink);border-color:var(--accent)}
.sec{scroll-margin-top:120px}
.ddt{padding:0;overflow:hidden}
.ddrow{display:grid;grid-template-columns:1.1fr 1.2fr 1.6fr;border-bottom:1px solid var(--line)}
.ddrow:last-child{border-bottom:0}
.ddrow>div{padding:11px 14px;font-size:14px}
.ddrow.head{background:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ddrow.head>div{font-size:11.5px;padding:9px 14px}
.ddrow .nm{font-weight:600}
.ddrow .sim{color:var(--muted)}
@media (max-width:900px){.ddrow{grid-template-columns:1fr}.ddrow.head{display:none}.ddrow>div{padding:4px 14px}.ddrow .nm{padding-top:12px}}
.scrim{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside.side{position:fixed;left:0;top:0;height:100vh;width:300px;background:var(--panel);z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:20px}
  body.nav aside.side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .navbtn{display:block}
  .toplinks{display:none}
  main{padding:20px 16px 50px}
  h1{font-size:30px}.hero h1{font-size:32px}.hero{padding:22px}
  .two{grid-template-columns:1fr}
  .brand span{display:none}
  .updlist .u{grid-template-columns:1fr;gap:4px}
}
.toplinks a{padding:7px 9px;font-size:13.5px;white-space:nowrap}
@media (max-width:1320px){.toplinks .opt{display:none}}
@media (max-width:1120px){.brand span{display:none}}
.tarea{margin-bottom:2px}
.tarea>button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.tarea>button:hover,.tarea>button.on{background:var(--soft)}
.chev{margin-left:auto;transition:transform .15s;color:var(--muted);font-size:11px}
.tarea.open .chev{transform:rotate(90deg)}
.tsub{display:none;padding:2px 0 6px 18px}
.tarea.open .tsub{display:block}
.tsub .sl{font-size:11.5px;color:var(--muted);margin:8px 8px 3px;font-weight:600}
.tsub a{display:block;padding:4px 8px;border-radius:6px;font-size:13.5px;text-decoration:none;opacity:.85}
.tsub a:hover{background:var(--soft);opacity:1}
.tsub a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);opacity:1;font-weight:600}
.tlinks a{display:block;padding:6px 8px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500}
.tlinks a:hover,.tlinks a.on{background:var(--soft)}
.ddrow.c2{grid-template-columns:1fr 2.4fr}
.secnote{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.emcard{border-left:4px solid var(--c);margin-bottom:14px}
.ddl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:13px}
.ddl a,.ddrow .nm>a{color:var(--accent);text-decoration:none;font-weight:600}
.ddl a:hover,.ddrow .nm>a:hover{text-decoration:underline}
.altsw{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px 5px 5px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);flex-shrink:0;margin-left:auto}
.altsw .knob{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.altsw .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.altsw[aria-pressed="true"] .knob{background:var(--green)}
.altsw[aria-pressed="true"] .knob::after{left:14px}
.altsw[aria-pressed="true"]{color:var(--ink)}
.search{margin-left:0}
body.noalt .altonly{display:none!important}
@media (max-width:900px){.altsw .lbl{display:none}.altsw{padding:5px}}
.altcat{margin-bottom:12px}
.altcat h3{font-size:14.5px;padding-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--green) 30%,transparent)}
.altitem{padding:9px 0;border-bottom:1px dashed var(--line)}
.altitem:last-child{border-bottom:0}
.altitem b{font-weight:600}
.altitem p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.ev{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.altnote{background:var(--amberbg);border:1px solid color-mix(in srgb,var(--amber) 28%,transparent);border-radius:12px;padding:11px 14px;font-size:13.5px;margin:0 0 12px}
.newb{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:999px;background:var(--amber);color:#fff;margin-left:6px;vertical-align:2px;font-family:var(--sans)}
.newb.big{font-size:12px;padding:3px 10px;vertical-align:8px;margin-left:12px;letter-spacing:0}
.checked{font-size:13.5px;color:var(--muted);margin:-2px 0 12px}
.checked a{color:var(--accent);text-decoration:none}

:root{--brand:#862e9c}
.feature{display:flex;gap:22px;align-items:center;margin:16px 0 4px;border-left:4px solid var(--brand)}
.feature b{font-family:var(--serif);font-size:20px;display:block;margin-bottom:4px}
.feature p{margin:0 0 8px;color:var(--muted);font-size:14.5px}
.feature .n{font-size:13px;font-weight:600;color:var(--brand)}
.feature svg{width:120px;height:120px;flex-shrink:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:4px 0 6px}
.facts>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.facts small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.facts b{font-weight:600;font-size:14px}
.xlink{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.mchip{display:inline-block;font-size:13px;font-weight:600;text-decoration:none;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);border-radius:999px;padding:2px 10px}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 9px 2px 7px;white-space:nowrap;cursor:pointer;font-family:inherit;color:var(--ink)}
.dchip:hover{border-color:var(--c)}
.dchip .dot{width:8px;height:8px}
.dchip.ok{border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:var(--greenbg)}

.chipline{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:flex-start;align-content:flex-start}
.muted{color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;flex-shrink:0}
.cxcard{padding:6px 18px 12px}
.cxgroup{padding:10px 0;border-bottom:1px solid var(--line)}
.cxgroup:last-of-type{border-bottom:0}
.cxh{display:flex;align-items:center;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:4px}

.cxrow .dchip{flex-shrink:0}

.cxfoot{padding-top:10px;font-size:13.5px}
.cxfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.gline{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.gline:last-child{border-bottom:0}
.pill.hl{border-color:var(--brand);color:var(--brand)}
.concepts .card p{margin:0;font-size:14px;color:var(--muted)}
.concepts .card h3{font-family:var(--serif);font-size:16.5px}
.netcard{padding:14px 16px}

.tchip.on{opacity:1;background:var(--panel);color:var(--ink);border-color:var(--c)}

<body>
<header class="top"><div class="topin">

const IMP = {"rheum": {"ra": {"id": "ra", "name": "Rheumatoid Arthritis (RA)", "aka": "Seropositive / seronegative RA", "ov": "A chronic, systemic autoimmune inflammatory arthritis that typically attacks the small joints of the hands and feet symmetrically. Untreated, it causes cartilage loss and erosions. Early, aggressive treatment preserves joints, and most patients now reach remission or low disease activity.", "sx": ["Symmetric swelling and tenderness of the small joints (MCPs, PIPs, wrists) on both sides", "Morning stiffness lasting more than an hour", "Fatigue, low-grade fever, weight loss, feeling generally unwell", "Later: deformities such as ulnar deviation, swan-neck or boutonnière patterns"], "early": ["Hand stiffness every morning that eases only after an hour or more", "Swelling of the knuckles on both hands that comes and goes", "Morning stiffness with fatigue in a person with a family history of autoimmune disease or smoking exposure"], "red": ["Fever with a hot, swollen joint (septic arthritis, especially on immunosuppression)", "Chest pain or shortness of breath (pleuritis, interstitial lung disease)", "Neck pain or new arm weakness or clumsiness (atlantoaxial subluxation)", "Red painful eye (scleritis) or new skin ulcers or nerve symptoms (vasculitis)"], "dx": ["Clinical pattern: symmetric small-joint synovitis, morning stiffness, duration of symptoms", "Serology: rheumatoid factor and anti-citrullinated protein antibodies (ACPA/anti-CCP)", "Inflammation markers: CRP and ESR; CBC and liver/kidney function before drugs", "Imaging: hand and foot X-rays for erosions; ultrasound or MRI for early synovitis", "Classification with the 2010 ACR/EULAR criteria; baseline hepatitis B/C and TB screening before biologics"], "tx": [["Treat to target (remission or low disease activity)", ["Methotrexate is usually the first disease-modifying drug (DMARD), often with a short glucocorticoid bridge", "Reassess disease activity every 1–3 months and escalate if the target is not met", "Add or switch to a biologic: TNF inhibitors, abatacept, IL-6 blockers (tocilizumab, sarilumab), or rituximab"]], ["Targeted synthetic DMARDs", ["JAK inhibitors (tofacitinib, baricitinib, upadacitinib) are oral options; they carry boxed warnings for serious infection, malignancy, thrombosis and major cardiovascular events", "Leflunomide or sulfasalazine as alternatives or additions"]], ["Remission", ["The EULAR 2025 update advises against stopping DMARDs entirely, even in sustained remission, because flares can follow"]], ["Supportive care", ["NSAIDs for symptoms, only short term where possible; physical and occupational therapy; splints for flares", "Vaccinations before immunosuppression; smoking cessation; cardiovascular risk reduction"]], ["Lung involvement", ["RA-associated ILD: mycophenolate, azathioprine, or rituximab are conditionally recommended first-line (2023 ACR/CHEST); nintedanib or pirfenidone for progressive fibrosis", "Screen with PFTs and HRCT when risk factors or symptoms are present"]], ["Device therapy", ["SetPoint System: an implanted vagus nerve stimulator (about 1 minute of stimulation daily), FDA-approved July 2025 for adults with moderate-to-severe RA and an inadequate response or intolerance to biologic or targeted synthetic DMARDs (RESET-RA trial)"]]], "upd": ["Mar 2026: EULAR published its 2025 update of the RA management recommendations (Ann Rheum Dis 2026), advising that DMARDs not be discontinued even in sustained remission.", "Jul 2025: FDA approved the SetPoint System, the first neuroimmune modulation device for RA."], "tags": ["joint swelling", "morning stiffness", "hand pain", "fatigue", "fever", "symmetric"], "refs": [["Smolen JS, et al. EULAR recommendations for the management of rheumatoid arthritis with synthetic and biological DMARDs: 2022 update. Ann Rheum Dis. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=EULAR%20recommendations%20for%20the%20management%20of%20rheumatoid%20arthritis%20with%20synthetic%20and%20biological%20DMARDs%202022%20update"], ["Smolen JS, et al. EULAR recommendations for the management of RA with synthetic and biologic DMARDs: 2025 update. Ann Rheum Dis. 2026", "https://pubmed.ncbi.nlm.nih.gov/?term=EULAR%20recommendations%20for%20the%20management%20of%20rheumatoid%20arthritis%20with%20synthetic%20and%20biologic%20disease-modifying%20antirheumatic%20drugs%202025%20update"], ["Healio: New EULAR recommendations for rheumatoid arthritis (May 2026)", "https://www.healio.com/news/rheumatology/20260714/new-eular-recommendations-for-rheumatoid-arthritis-keep-pace-with-everevolving-field"], ["Aletaha D, et al. 2010 Rheumatoid arthritis classification criteria: an ACR/EULAR collaborative initiative. Arthritis Rheum. 2010", "https://pubmed.ncbi.nlm.nih.gov/?term=2010%20Rheumatoid%20arthritis%20classification%20criteria%3A%20an%20American%20College%20of%20Rheumatology%2FEuropean%20League%20Against%20Rheumatism%20collaborative%20initiative"], ["American College of Rheumatology: Rheumatoid Arthritis patient resources", "https://www.rheumatology.org/"], ["Healio: FDA approves vagus nerve stimulator for rheumatoid arthritis (2025)", "https://www.healio.com/news/rheumatology/20250912/fda-approves-vagus-nerve-stimulator-for-rheumatoid-arthritis"], ["Johnson SR, et al. 2023 ACR/CHEST Guideline for Treatment of ILD in Systemic Autoimmune Rheumatic Diseases. Arthritis Rheumatol. 2024", "https://pubmed.ncbi.nlm.nih.gov/38978310/"], ["NIAMS: Rheumatoid Arthritis", "https://www.niams.nih.gov/health-topics/rheumatoid-arthritis"]], "alt": [{"c": "Exercise", "t": "Regular, consistent exercise", "e": "strong", "n": "The only strong recommendation in the 2022 ACR integrative guideline; improves function, pain, fatigue, and cardiovascular health alongside DMARDs."}, {"c": "Exercise", "t": "Aerobic, resistance, aquatic, and mind-body exercise (yoga, tai chi)", "e": "cond", "n": "Any of these is reasonable; choose what is enjoyable and sustainable. Example: brisk walking or cycling 150 min/week plus two sessions of muscle strengthening."}, {"c": "Exercise", "t": "Hand exercise program", "e": "cond", "n": "Daily stretching and strengthening of the hands (e.g., finger flexion/extension, thumb opposition, grip with soft putty) to maintain function; best taught by a hand therapist."}, {"c": "Diet", "t": "Mediterranean-style diet", "e": "cond", "n": "Vegetables, fruit, legumes, whole grains, olive oil, fish, nuts; limited red meat and processed foods. Also lowers cardiovascular risk, which is raised in RA."}, {"c": "Diet", "t": "Other defined diets (e.g., vegan, gluten-free, elimination, 'anti-inflammatory' programs)", "e": "against", "n": "Conditionally recommended against by ACR because evidence of benefit for RA is weak and the burden and cost are high."}, {"c": "Diet", "t": "Therapeutic fasting periods", "e": "limited", "n": "Small studies show short-term symptom improvement during fasting that usually reverses when normal eating resumes; not a substitute for DMARDs and unsafe with some medications."}, {"c": "Supplements & vitamins", "t": "Routine dietary supplements", "e": "against", "n": "ACR conditionally recommends following established dietary guidance without adding supplements for RA management."}, {"c": "Supplements & vitamins", "t": "Fish oil (omega-3)", "e": "some", "n": "Older trials show modest improvement in tender joints and less NSAID use at high doses (around 3 g EPA+DHA/day), but ACR does not recommend routine supplementation; can increase bleeding risk with anticoagulants."}, {"c": "Supplements & vitamins", "t": "Vitamin D", "e": "some", "n": "In the VITAL trial of older adults, 2,000 IU/day for 5 years reduced new autoimmune disease by about 22% — evidence for prevention, not for treating established RA. Correct deficiency if present."}, {"c": "Supplements & vitamins", "t": "Turmeric/curcumin, black seed oil (Nigella sativa), boswellia", "e": "limited", "n": "Small, short trials with variable product quality; curcumin can increase bleeding risk with anticoagulants and has rare liver-injury reports."}, {"c": "Mind-body & manual therapies", "t": "Acupuncture", "e": "cond", "n": "Conditionally recommended for symptom relief based on low-certainty evidence."}, {"c": "Mind-body & manual therapies", "t": "Massage therapy", "e": "cond", "n": "Conditionally recommended (very low certainty)."}, {"c": "Mind-body & manual therapies", "t": "Heat and cold (thermal modalities)", "e": "cond", "n": "Warm baths, paraffin wax for stiff hands, or cold packs for flaring joints."}, {"c": "Mind-body & manual therapies", "t": "Cognitive behavioral therapy and mind-body approaches; self-management programs", "e": "cond", "n": "Help with pain coping, fatigue, sleep, and mood."}, {"c": "Mind-body & manual therapies", "t": "Chiropractic therapy and electrotherapy", "e": "against", "n": "Conditionally recommended against by ACR; spinal manipulation of the neck can be dangerous in RA (cervical instability)."}, {"c": "Other", "t": "Occupational therapy, splints, and joint protection", "e": "cond", "n": "Splints for painful wrists and hands, assistive devices, and energy conservation."}, {"c": "Lifestyle", "t": "Stop smoking", "e": "standard", "n": "Smoking increases RA risk and severity and reduces response to some drugs."}], "altRefs": [["England BR, et al. 2022 ACR Guideline for Exercise, Rehabilitation, Diet, and Additional Integrative Interventions for RA. Arthritis Care Res. 2023", "https://pubmed.ncbi.nlm.nih.gov/37227116/"], ["Hahn J, et al. Vitamin D and marine omega 3 fatty acid supplementation and incident autoimmune disease: VITAL randomized controlled trial. BMJ. 2022", "https://www.bmj.com/content/376/bmj-2021-066452"], ["Medscape: ACR Introduces Guideline for Integrative Interventions in RA", "https://www.medscape.com/viewarticle/983739"]], "ddx": [["Psoriatic arthritis", "Symmetric-looking small-joint swelling and morning stiffness", "Asymmetric pattern, DIP joints, dactylitis, nail changes, psoriasis; RF and anti-CCP usually negative"], ["Osteoarthritis (hand)", "Hand pain and stiffness, knuckle swelling", "Bony enlargement, short morning stiffness, normal CRP, no systemic symptoms"], ["Systemic lupus", "Arthralgia, fatigue, rash", "Non-erosive arthritis; ANA, anti-dsDNA, low complement, organ involvement"], ["Viral arthritis (parvovirus, hepatitis C, chikungunya)", "Symmetric small-joint pain", "Recent infection or exposure; often self-limited; specific viral testing"]]}, "psa": {"id": "psa", "name": "Psoriatic Arthritis (PsA)", "aka": "Psoriatic spondyloarthritis", "ov": "An inflammatory arthritis that occurs with psoriasis, often years after skin disease appears (sometimes without skin symptoms). It can involve peripheral joints, the spine, entheses (tendon and ligament attachments), and nails. Early diagnosis limits joint damage.", "sx": ["Asymmetric arthritis of a few joints, including the DIP joints of the fingers", "Dactylitis: sausage-like swelling of a whole finger or toe", "Enthesitis: heel pain (Achilles or plantar fascia), elbow or knee tendon pain", "Nail pitting, nail separation, and scaly skin patches"], "early": ["Finger swelling or pain in a person with psoriasis or a family history of psoriasis", "Morning stiffness with heel pain or back pain", "New nail changes with joint pain"], "red": ["Hot, swollen joint with fever (infection)", "Severe back pain with fever or weight loss (evaluate for spinal infection or malignancy)"], "dx": ["CASPAR classification criteria (psoriasis, nail dystrophy, negative RF, dactylitis, juxta-articular new bone formation)", "X-rays for erosions and new bone formation; ultrasound or MRI for enthesitis and synovitis", "CRP and HLA-B27 where spondyloarthritis is suspected"], "tx": [["Disease-modifying", ["TNF inhibitors (adalimumab, etanercept, infliximab, golimumab, certolizumab) treat skin, joints and enthesitis", "IL-17 inhibitors (secukinumab, ixekizumab, bimekizumab) and IL-23 inhibitors (guselkumab, risankizumab) are strong options for joints and skin", "Ustekinumab (IL-12/23), abatacept, apremilast (PDE4) and JAK inhibitors are alternatives", "Deucravacitinib (Sotyktu), a once-daily oral TYK2 inhibitor, approved for PsA in March 2026", "Tildrakizumab (Ilumya), a clinician-administered IL-23 inhibitor given every 12 weeks after loading, approved for PsA in October 2026"]], ["Cautions", ["IL-17 inhibitors can worsen inflammatory bowel disease; consider this when choosing a drug", "Methotrexate and leflunomide have limited effect on joints but may be used alongside other therapy"]], ["Symptom control", ["NSAIDs, local steroid injections for tendons and joints, physical therapy and exercise"]]], "upd": ["Oct 2026: FDA approved tildrakizumab (Ilumya) for adults with active psoriatic arthritis, based on the INSPIRE-1 and INSPIRE-2 trials.", "Mar 2026: FDA approved deucravacitinib (Sotyktu), the first TYK2 inhibitor for psoriatic arthritis."], "tags": ["joint swelling", "nails", "dactylitis", "heel pain", "skin patches", "asymmetric"], "refs": [["GRAPPA treatment recommendations for psoriatic arthritis (2023 update)", "https://pubmed.ncbi.nlm.nih.gov/?term=GRAPPA%20treatment%20recommendations%20for%20psoriatic%20arthritis%202023"], ["AJMC: FDA Approves First TYK2 Inhibitor for Adults With Active Psoriatic Arthritis (Mar 2026)", "https://www.ajmc.com/view/fda-approves-first-tyk2-inhibitor-for-adults-with-active-psoriatic-arthritis"], ["Healio: FDA approves Ilumya for adults with psoriatic arthritis (Oct 2026)", "https://www.healio.com/news/rheumatology/20261030/fda-approves-ilumya-for-adults-with-psoriatic-arthritis"], ["Taylor W, et al. Classification criteria for psoriatic arthritis (CASPAR). Arthritis Rheum. 2006", "https://pubmed.ncbi.nlm.nih.gov/?term=Classification%20criteria%20for%20psoriatic%20arthritis%3A%20development%20of%20new%20criteria%20from%20a%20large%20international%20study"], ["NIAMS: Psoriatic Arthritis", "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"]], "alt": [{"c": "Lifestyle", "t": "Weight loss if overweight", "e": "some", "n": "Obesity is linked to higher disease activity and poorer response to TNF inhibitors; weight loss in trials improved disease activity."}, {"c": "Exercise", "t": "Regular exercise and physical therapy", "e": "some", "n": "Strength, flexibility, and aerobic exercise improve function and fatigue; low-impact options (swimming, cycling) suit enthesitis."}, {"c": "Diet", "t": "Mediterranean-style diet", "e": "limited", "n": "Associated with lower disease activity in observational studies; also benefits cardiovascular risk, which is raised in psoriatic disease."}, {"c": "Supplements & vitamins", "t": "Fish oil, vitamin D", "e": "limited", "n": "Small trials show little or inconsistent benefit for joints; vitamin D deficiency should be corrected."}, {"c": "Lifestyle", "t": "Limit alcohol", "e": "some", "n": "Alcohol worsens psoriasis and adds liver risk with methotrexate or leflunomide."}, {"c": "Lifestyle", "t": "Stop smoking", "e": "standard", "n": "Smoking is linked to worse psoriasis and poorer treatment response."}], "altRefs": [["Klingberg E, et al. Weight loss improves disease activity in patients with psoriatic arthritis and obesity. Arthritis Res Ther. 2019", "https://pubmed.ncbi.nlm.nih.gov/?term=Weight%20loss%20improves%20disease%20activity%20in%20patients%20with%20psoriatic%20arthritis%20and%20obesity%3A%20an%20interventional%20study"]], "ddx": [["Rheumatoid arthritis", "Inflammatory polyarthritis with swelling", "No psoriasis, no dactylitis or enthesitis; RF or anti-CCP more often positive; symmetric"], ["Gout", "Painful, swollen toes or feet", "Sudden attacks; urate crystals on joint fluid; no nail or skin psoriasis"], ["Reactive arthritis", "Asymmetric lower-limb arthritis, enthesitis, nail and skin change", "Follows GI or urogenital infection; conjunctivitis or urethritis"]]}, "axspa": {"id": "axspa", "name": "Axial Spondyloarthritis (axSpA)", "aka": "Ankylosing spondylitis, non-radiographic axSpA", "ov": "A family of inflammatory conditions of the sacroiliac joints and spine, closely linked to HLA-B27. Ankylosing spondylitis shows structural changes on X-ray; non-radiographic axSpA shows inflammation on MRI only. Typically begins in young adults.", "sx": ["Inflammatory back pain: onset before age 40, gradual, improves with exercise, worse at rest and at night", "Morning back stiffness lasting more than 30 minutes", "Buttock or hip pain alternating sides; reduced spinal motion over time", "Recurrent anterior uveitis (painful red eye), bowel inflammation, psoriasis"], "early": ["Low back or buttock pain at night in a person under 40 that improves with movement", "Recurrent painful red eye with light sensitivity"], "red": ["Painful red eye with blurred vision (urgent eye review)", "Back pain with fever, weight loss or night sweats (infection or malignancy)", "Bladder or bowel change with leg weakness (cauda equina syndrome)"], "dx": ["Sacroiliac joint MRI showing bone marrow edema (the most sensitive imaging test for early disease)", "X-rays for sacroiliitis in established disease; HLA-B27 testing; CRP", "ASAS classification criteria (imaging plus clinical features)"], "tx": [["First line", ["Regular NSAIDs (taken on a schedule) for pain and stiffness", "Structured exercise, physical therapy, and posture work"]], ["Biologics and targeted drugs", ["TNF inhibitors (adalimumab, etanercept, golimumab, certolizumab, infliximab)", "IL-17 inhibitors (secukinumab, ixekizumab, bimekizumab)", "JAK inhibitors (upadacitinib, tofacitinib) for patients who do not respond to biologics"]], ["Notes", ["Sulfasalazine helps peripheral arthritis but not the spine; methotrexate is not effective for axial disease"]], ["2026 ACR/SAA/SPARTAN update", ["NSAIDs remain first-line for most patients", "JAK inhibitors (tofacitinib, upadacitinib) elevated to a strong recommendation in the second-line setting", "Strong recommendation against IL-23 inhibitors for axial disease", "Conventional DMARDs (methotrexate, sulfasalazine) not recommended for axial disease unless peripheral arthritis or uveitis, IBD, or psoriasis is present", "Avoid long-term systemic glucocorticoids and opioids; new guidance on nociplastic pain, bone health, and comorbidities", "First dedicated guideline for juvenile axSpA"]]], "tags": ["back pain", "stiffness at night", "buttock pain", "uveitis", "red eye"], "refs": [["Ramiro S, et al. ASAS-EULAR recommendations for the management of axial spondyloarthritis: 2022 update. Ann Rheum Dis. 2023", "https://pubmed.ncbi.nlm.nih.gov/?term=ASAS-EULAR%20recommendations%20for%20the%20management%20of%20axial%20spondyloarthritis%202022%20update"], ["Rudwaleit M, et al. The development of ASAS classification criteria for axial spondyloarthritis. Ann Rheum Dis. 2009", "https://pubmed.ncbi.nlm.nih.gov/?term=The%20development%20of%20Assessment%20of%20SpondyloArthritis%20international%20Society%20classification%20criteria%20for%20axial%20spondyloarthritis"], ["ACR: New Guidelines Advance Treatment of Axial Spondyloarthritis in Adults and Youth (Jun 2026)", "https://rheumatology.org/press-releases/new-guidelines-advance-treatment-of-axial-spondyloarthritis-in-adults-and-youth/"], ["Rheum-Live: ACR updates axSpA guidelines (Jun 2026)", "https://www.rheum-live.com/view/acr-updates-axspa-guidelines-adds-juvenile-recommendations"]], "upd": ["Jun 2026: ACR/SAA/SPARTAN released updated adult axSpA guidelines and the first juvenile axSpA guideline."], "alt": [{"c": "Exercise", "t": "Daily spinal mobility, posture, and breathing exercises", "e": "standard", "n": "The cornerstone of axSpA care. Example routine: cat–camel, prone press-ups, chin tucks, thoracic rotations, hip flexor stretches, and deep breathing to keep chest expansion; supervised or group PT improves adherence."}, {"c": "Exercise", "t": "Aerobic and aquatic exercise (swimming)", "e": "some", "n": "Improves pain, function, and cardiovascular fitness."}, {"c": "Mind-body & manual therapies", "t": "Acupuncture and massage", "e": "cond", "n": "Conditionally recommended in the 2026 ACR/SAA/SPARTAN guideline."}, {"c": "Mind-body & manual therapies", "t": "Spa and balneotherapy combined with exercise", "e": "limited", "n": "Some short-term benefit in European studies."}, {"c": "Other", "t": "Alternative medicine (unspecified remedies)", "e": "against", "n": "The 2026 guideline conditionally recommends against alternative medicine as treatment."}, {"c": "Mind-body & manual therapies", "t": "Spinal manipulation", "e": "against", "n": "Avoid in fused or osteoporotic spines (fracture risk)."}, {"c": "Lifestyle", "t": "Stop smoking", "e": "standard", "n": "Smoking is associated with faster spinal fusion and worse function."}], "altRefs": [["Guideline Central: 2026 ACR Guideline for Treatment of Adults with axSpA (spotlight)", "https://www.guidelinecentral.com/insights/jul-2026-acr-treatmentofadultswithaxspa-guideline-video-copy/"]], "ddx": [["Mechanical low back pain", "Back pain and stiffness", "Worse with activity, better with rest; no night pain or inflammatory markers; no MRI inflammation"], ["Diffuse idiopathic skeletal hyperostosis (DISH)", "Spinal stiffness in older adults", "Flowing bridging bone on imaging; sacroiliac joints normal; usually over 50"], ["Spinal infection (e.g., tuberculosis or brucellosis)", "Back pain with stiffness", "Fever, weight loss, systemic illness; imaging and cultures establish diagnosis"]]}, "sle": {"id": "sle", "name": "Systemic Lupus Erythematosus (SLE)", "aka": "Lupus", "ov": "A chronic multisystem autoimmune disease with flares and remissions, mostly affecting women of childbearing age. Antinuclear antibodies (ANA) appear in most patients, but organ involvement determines treatment. Lupus nephritis is the most important organ threat.", "sx": ["Fatigue, fever, weight change", "Butterfly rash, photosensitive rashes, oral ulcers, hair loss", "Painful or swollen joints without erosion", "Pleuritic n addition to the IV form", "Belimumab is approved for children aged 5–17 with active lupus nephritis"]], ["Pregnancy and cardiovascular care", ["Plan pregnancy during quiet disease; continue hydroxychloroquine; mycophenolate must be stopped before pregnancy", "Low-dose aspirin from the first trimester for patients at risk of preeclampsia; cardiovascular risk management", "Sun protection, vaccinations, and bone health"]], ["Investigational", ["CD19-directed CAR-T cell therapy has produced drug-free remissions in small refractory-lupus studies; trials continue, but some programs paused in 2026 after deaths from severe inflammatory reactions (see Emerging therapies)", "Litifilimab (anti-BDCA2) and deucravacitinib are in phase 3 trials"]]], "upd": ["Nov 2025: ACR released its 2025 SLE treatment guideline, emphasizing hydroxychloroquine for all, limiting glucocorticoid duration, and early immunosuppressive or biologic therapy.", "Oct 2025: FDA approved obinutuzumab (Gazyva) for adults with active lupus nephritis on standard therapy (REGENCY trial).", "May 2025: ACR published its 2024 lupus nephritis guideline, framing treatment as continuous rather than induction then maintenance.", "Apr 2026: FDA approved a once-weekly subcutaneous anifrolumab (Saphnelo Pen) autoinjector for moderate-to-severe SLE."], "tags": ["rash", "joint pain", "fatigue", "mouth ulcers", "foamy urine", "hair loss", "chest pain", "photosensitivity"], "refs": [["Fanouriakis A, et al. EULAR recommendations for the management of SLE: 2023 update. Ann Rheum Dis. 2024", "https://pubmed.ncbi.nlm.nih.gov/?term=EULAR%20recommendations%20for%20the%20management%20of%20systemic%20lupus%20erythematosus%202023%20update"], ["Sammaritano LR, et al. 2025 ACR Guideline for the Treatment of Systemic Lupus Erythematosus. Arthritis Care Res. 2025", "https://pubmed.ncbi.nlm.nih.gov/41182321/"], ["Sammaritano LR, et al. 2024 ACR Guideline for the Screening, Treatment, and Management of Lupus Nephritis. 2025", "https://pu
